<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Project Tracker</title>
  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
  <!-- React and compiler libraries -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Styling framework -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    textarea:focus, input:focus, select:focus, [contenteditable]:focus {
      outline: none !important;
      box-shadow: none !important;
    }
    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    /* Elegant placeholder engine for custom contentEditable nodes */
    [contenteditable]:empty:before {
      content: attr(data-placeholder);
      color: #94a3b8;
      opacity: 0.6;
      cursor: text;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect, useRef, useLayoutEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyCiQU2ilhdlJkxD7-kWHl6lkO2LKQYnC7E",
      authDomain: "master-tracker-7b104.firebaseapp.com",
      projectId: "master-tracker-7b104",
      storageBucket: "master-tracker-7b104.firebasestorage.app",
      messagingSenderId: "706171177063",
      appId: "1:706171177063:web:ac2415157560969c5a6cc2"
    };
    
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    db.enablePersistence({ synchronizeTabs: true }).catch((err) => {
      console.warn("Firestore persistence state:", err.code);
    });

    const CATEGORIES = ['None', 'Personal', 'Career', 'Family', 'Spiritual', 'Financial', 'Learning'];

    const CATEGORY_COLORS = {
      'None': { border: 'border-l-slate-900', bg: 'bg-slate-100/30', text: 'text-slate-900', label: 'text-slate-700' },
      'Personal': { border: 'border-l-blue-500', bg: 'bg-blue-50/40', text: 'text-blue-900', label: 'text-blue-600' },
      'Career': { border: 'border-l-orange-500', bg: 'bg-orange-50/40', text: 'text-orange-955', label: 'text-orange-650' }, // Dark Orange
      'Family': { border: 'border-l-fuchsia-500', bg: 'bg-fuchsia-50/40', text: 'text-fuchsia-955', label: 'text-fuchsia-600' }, // Magenta
      'Spiritual': { border: 'border-l-green-500', bg: 'bg-green-50/40', text: 'text-green-900', label: 'text-green-600' },
      'Financial': { border: 'border-l-purple-500', bg: 'bg-purple-50/40', text: 'text-purple-900', label: 'text-purple-600' },
      'Learning': { border: 'border-l-pink-500', bg: 'bg-pink-50/40', text: 'text-pink-900', label: 'text-pink-600' }, // Pink Learning Category
      '': { border: 'border-l-slate-900', bg: 'bg-slate-100/30', text: 'text-slate-900', label: 'text-slate-700' }
    };

    const PRIORITIES = [
      { level: 0, label: '' },
      { level: 1, label: '❗' },
      { level: 2, label: '‼️' }
    ];

    // Focus-preserving contentEditable Input: Permits natural wrapping without textarea UI weight
    const AutoSaveInput = ({ value, onSave, className, placeholder }) => {
      const elRef = useRef(null);
      const committedValue = useRef(value || '');

      useEffect(() => {
        if (elRef.current && document.activeElement !== elRef.current) {
          elRef.current.innerText = value || '';
          committedValue.current = value || '';
        }
      }, [value]);

      const handleBlur = () => {
        if (elRef.current) {
          const currentVal = elRef.current.innerText.trim();
          if (currentVal !== committedValue.current) {
            onSave(currentVal);
            committedValue.current = currentVal;
          }
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault(); // Deny multi-line linebreaks inside project headers
          elRef.current.blur();
        }
      };

      return (
        <div 
          ref={elRef}
          contentEditable
          suppressContentEditableWarning
          onBlur={handleBlur}
          onKeyDown={handleKeyDown}
          className={`${className} cursor-text break-words whitespace-normal outline-none focus:outline-none min-h-[1.5em] w-full`}
          data-placeholder={placeholder}
          style={{ wordBreak: 'break-word', display: 'inline-block' }}
        />
      );
    };

    // Auto-growing textarea with input protection and overflow buffers to prevent vertical clipping
    const AutoResizeTextarea = ({ value, onSave, onKeyDown, autoFocus, className, placeholder }) => {
      const textareaRef = useRef(null);
      const [val, setVal] = useState(value || '');
      const isFocused = useRef(false);

      useEffect(() => {
        if (!isFocused.current) {
          setVal(value || '');
        }
      }, [value]);
      
      useLayoutEffect(() => {
        const el = textareaRef.current;
        if (el) {
          el.style.height = 'auto';
          el.style.height = `${el.scrollHeight + 4}px`;
        }
      }, [val]);

      useEffect(() => {
        if (autoFocus && textareaRef.current) {
          textareaRef.current.focus();
          const len = textareaRef.current.value.length;
          textareaRef.current.setSelectionRange(len, len);
        }
      }, [autoFocus]);
      
      return (
        <textarea 
          ref={textareaRef} 
          value={val} 
          placeholder={placeholder}
          onChange={(e) => setVal(e.target.value)}
          onFocus={() => { isFocused.current = true; }}
          onBlur={() => { 
            isFocused.current = false; 
            if (val !== value) onSave(val); 
          }} 
          onKeyDown={(e) => { if (onKeyDown) onKeyDown(e, val); }}
          className={`${className} resize-none overflow-hidden bg-transparent border-none focus:ring-0 p-0 break-words whitespace-normal`} 
          rows={1} 
        />
      );
    };

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError() { return { hasError: true }; }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-8 text-center">
              <h2 className="text-lg font-bold text-red-600">A presentation error occurred in the workspace.</h2>
              <button onClick={() => window.location.reload()} className="mt-4 px-4 py-2 bg-amber-500 text-white rounded">Reload Dashboard</button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [projects, setProjects] = useState([]);
      const [focusId, setFocusId] = useState(null);
      const [showArchived, setShowArchived] = useState(false);
      
      // Sorting & Filtering State
      const [priorityFilter, setPriorityFilter] = useState('all');
      const [sortBy, setSortBy] = useState('manual'); // 'manual', 'priority-desc', 'priority-asc'

      useEffect(() => {
        return auth.onAuthStateChanged((u) => {
          setUser(u);
          setLoading(false);
        });
      }, []);

      useEffect(() => {
        if (!user) return;
        return db.collection('users').doc(user.uid).collection('projects')
          .onSnapshot(snapshot => {
            let data = snapshot.docs.map(doc => {
              const raw = doc.data();
              return {
                id: doc.id,
                name: raw.name || '',
                category: raw.category || 'None',
                priority: typeof raw.priority === 'number' ? raw.priority : 0,
                orderIndex: typeof raw.orderIndex === 'number' ? raw.orderIndex : 0,
                status: raw.status || '',
                nextSteps: Array.isArray(raw.nextSteps) ? raw.nextSteps : [],
                notes: Array.isArray(raw.notes) ? raw.notes : [],
                archived: !!raw.archived
              };
            });

            // Self-Healing Index Logic: Fix missing or zero index sequences immediately
            const needsIndexing = data.some(p => p.orderIndex === 0);
            if (needsIndexing && data.length > 0) {
              const batch = db.batch();
              data.forEach((p, idx) => {
                const docRef = db.collection('users').doc(user.uid).collection('projects').doc(p.id);
                batch.update(docRef, { orderIndex: (idx + 1) * 100 });
                p.orderIndex = (idx + 1) * 100;
              });
              batch.commit().catch(err => console.error("Self-healing index failed:", err));
            }

            setProjects(data);
          }, err => console.error("Database sync error:", err));
      }, [user]);

      const getProjectDoc = (id) => db.collection('users').doc(user.uid).collection('projects').doc(String(id));

      const updateProjectField = (id, field, val) => {
        if (!user) return;
        getProjectDoc(id).set({ [field]: val }, { merge: true })
          .catch(err => console.error("Update field failed:", err));
      };

      const createProject = () => {
        if (!user) return;
        const maxOrder = projects.length > 0 ? Math.max(...projects.map(p => p.orderIndex || 0)) : 0;
        db.collection('users').doc(user.uid).collection('projects').add({
          name: '',
          category: 'None',
          priority: 0,
          orderIndex: maxOrder + 100,
          status: '',
          nextSteps: [],
          notes: [],
          archived: false
        });
      };

      const deleteProject = (id) => {
        if (!confirm("Are you sure you want to permanently delete this project?")) return;
        getProjectDoc(id).delete().catch(err => console.error("Deletion failed:", err));
      };

      // Manual Reordering Controller
      const moveProject = (currentIndex, direction) => {
        if (!user) return;
        const targetIndex = currentIndex + direction;
        if (targetIndex < 0 || targetIndex >= sortedMasterList.length) return;

        const currentProject = sortedMasterList[currentIndex];
        const targetProject = sortedMasterList[targetIndex];

        const tempIndex = currentProject.orderIndex;
        
        const batch = db.batch();
        batch.update(getProjectDoc(currentProject.id), { orderIndex: targetProject.orderIndex });
        batch.update(getProjectDoc(targetProject.id), { orderIndex: tempIndex });
        
        batch.commit().catch(err => console.error("Reorder failed:", err));
      };

      const handleListKeyDown = (e, project, field, item, idx, currentText) => {
        const list = [...(project[field] || [])];
        const indentLevel = item.indent || 0;
        
        if (e.key === 'Enter') {
          e.preventDefault();
          list[idx] = { ...list[idx], text: currentText };
          const newId = `item-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`;
          list.splice(idx + 1, 0, { id: newId, text: '', done: false, indent: indentLevel });
          setFocusId(newId);
          updateProjectField(project.id, field, list);
        } else if (e.key === 'Tab') {
          e.preventDefault();
          const change = e.shiftKey ? -1 : 1;
          const nextIndent = Math.max(0, indentLevel + change);
          list[idx] = { ...list[idx], text: currentText, indent: nextIndent };
          updateProjectField(project.id, field, list);
        } else if (e.key === 'Backspace' && currentText === '') {
          e.preventDefault();
          list.splice(idx, 1);
          if (idx > 0) {
            setFocusId(project[field][idx - 1].id || null);
          } else {
            setFocusId(null);
          }
          updateProjectField(project.id, field, list);
        }
      };

      const renderList = (project, field, colors) => {
        const list = project[field] || [];
        return (
          <div className="flex flex-col gap-1.5 text-base break-words">
            {list.map((item, idx) => {
              if (!item.id) item.id = `fallback-${idx}`;
              const indentLevel = item.indent || 0;
              return (
                <div 
                  key={item.id} 
                  className="flex items-start gap-2 group transition-all duration-150 break-words" 
                  style={{ marginLeft: `${indentLevel * 16}px` }}
                >
                  <input 
                    type="checkbox" 
                    checked={item.done || false} 
                    onChange={(e) => {
                      const newList = [...list];
                      newList[idx] = { ...newList[idx], done: e.target.checked };
                      updateProjectField(project.id, field, newList);
                    }} 
                    className="mt-1 h-4 w-4 rounded border-slate-300 text-amber-500 focus:ring-amber-500 cursor-pointer flex-shrink-0"
                  />
                  <AutoResizeTextarea
                    value={item.text || ''}
                    placeholder="..."
                    autoFocus={focusId === item.id}
                    onSave={(v) => {
                      const newList = [...list];
                      newList[idx] = { ...newList[idx], text: v };
                      updateProjectField(project.id, field, newList);
                    }}
                    onKeyDown={(e, textVal) => handleListKeyDown(e, project, field, item, idx, textVal)}
                    className={`flex-1 bg-transparent border-none focus:ring-0 text-base py-0 px-1 leading-relaxed outline-none break-words ${colors.text} ${item.done ? 'line-through opacity-50' : ''}`}
                  />
                </div>
              );
            })}
            <button 
              onClick={() => {
                const newId = `item-${Date.now()}`;
                const newList = [...list, { id: newId, text: '', done: false, indent: 0 }];
                setFocusId(newId);
                updateProjectField(project.id, field, newList);
              }} 
              className="text-xs text-slate-400 hover:text-amber-600 transition flex items-center gap-1 mt-1 pl-1"
            >
              + Add item
            </button>
          </div>
        );
      };

      if (loading) return <div className="h-screen flex items-center justify-center text-slate-500 font-medium">Connecting...</div>;
      if (!user) return (
        <div className="h-screen flex flex-col items-center justify-center gap-4 bg-slate-100 p-4">
          <div className="bg-white p-8 rounded-xl shadow-md flex flex-col items-center gap-6 max-w-sm w-full text-center">
            <h1 className="text-2xl font-bold tracking-tight text-slate-800">Master Project Tracker</h1>
            <p className="text-slate-500 text-sm">Please sign in to access your secure database sandbox.</p>
            <button 
              onClick={() => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())} 
              className="w-full px-5 py-3 bg-amber-500 hover:bg-amber-600 text-white rounded-lg font-bold shadow-md hover:shadow-lg transition flex items-center justify-center gap-2"
            >
              Sign in with Google
            </button>
          </div>
        </div>
      );

      // 1. Establish the clean master sorting hierarchy (independent of filters)
      const sortedMasterList = [...projects]
        .filter(p => p.archived === showArchived)
        .sort((a, b) => {
          if (sortBy === 'priority-desc') return b.priority - a.priority;
          if (sortBy === 'priority-asc') return a.priority - b.priority;
          return a.orderIndex - b.orderIndex; // Default manual hierarchy
        });

      // 2. Apply filtering conditions cleanly on top of sorted states
      const displayedProjects = sortedMasterList.filter(p => {
        if (priorityFilter !== 'all') {
          return p.priority === parseInt(priorityFilter, 10);
        }
        return true;
      });

      const isManualOrderingActive = sortBy === 'manual' && priorityFilter === 'all';

      return (
        <ErrorBoundary>
          <div className="p-4 md:p-6 bg-slate-50 min-h-screen">
            {/* Header Control Panel */}
            <div className="max-w-[1400px] mx-auto mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div className="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4">
                <h1 className="text-2xl font-extrabold text-slate-850 tracking-tight">My Workspace</h1>
                <div className="text-xs text-slate-500 bg-slate-200/80 px-2.5 py-1 rounded-full font-mono self-start sm:self-auto truncate max-w-[280px]">
                  {user.email}
                </div>
              </div>
              <div className="flex flex-wrap gap-2 items-center">
                {/* Priority Filter */}
                <div className="flex items-center bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-slate-700">
                  <span className="mr-2 text-slate-400">Filter:</span>
                  <select 
                    value={priorityFilter} 
                    onChange={(e) => setPriorityFilter(e.target.value)} 
                    className="bg-transparent border-none p-0 pr-6 text-xs font-bold cursor-pointer"
                  >
                    <option value="all">All Priorities</option>
                    <option value="2">‼️ Escalation</option>
                    <option value="1">❗ Priority</option>
                    <option value="0">Normal</option>
                  </select>
                </div>

                {/* Sort Order Selector */}
                <div className="flex items-center bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-slate-700">
                  <span className="mr-2 text-slate-400">Sort:</span>
                  <select 
                    value={sortBy} 
                    onChange={(e) => setSortBy(e.target.value)} 
                    className="bg-transparent border-none p-0 pr-6 text-xs font-bold cursor-pointer"
                  >
                    <option value="manual">Manual Order</option>
                    <option value="priority-desc">Priority: High to Low</option>
                    <option value="priority-asc">Priority: Low to High</option>
                  </select>
                </div>

                <button 
                  onClick={() => setShowArchived(!showArchived)} 
                  className={`px-4 py-2 text-xs rounded-lg font-bold border transition duration-150 ${!showArchived ? 'bg-white border-slate-200 text-slate-755 hover:bg-slate-50' : 'bg-amber-500 border-amber-600 text-white hover:bg-amber-600'}`}
                >
                  {showArchived ? "View Active Projects" : "View Archived Projects"}
                </button>
                <button 
                  onClick={() => auth.signOut()} 
                  className="px-4 py-2 text-xs bg-white border border-slate-200 text-slate-500 rounded-lg font-semibold hover:text-red-600 hover:border-red-200 transition duration-150"
                >
                  Sign Out
                </button>
              </div>
            </div>

            {/* Core Workspace Table */}
            <div className="max-w-[1400px] mx-auto bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
              <div className="overflow-x-auto w-full custom-scrollbar">
                <table className="w-full text-left border-collapse min-w-[1250px] table-fixed">
                  <thead className="bg-amber-400 text-amber-955 text-sm uppercase tracking-wider font-extrabold">
                    <tr>
                      <th className="p-5 w-[18%]">Project</th>
                      <th className="p-5 w-[11%]">Priority</th>
                      <th className="p-5 w-[13%]">Category</th>
                      <th className="p-5 w-[18%]">Status</th>
                      <th className="p-5 w-[16%]">Next Steps</th>
                      <th className="p-5 w-[16%]">Notes</th>
                      <th className="p-5 w-[8%] text-center">Order</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {displayedProjects.map((p, index) => {
                      const colors = CATEGORY_COLORS[p.category] || CATEGORY_COLORS['None'];
                      return (
                        <tr key={p.id} className={`${colors.bg} hover:bg-slate-50/60 transition group/row`}>
                          {/* Project Name (Wrap-enabled inline container) */}
                          <td className={`p-5 align-top border-l-4 ${colors.border} break-words`}>
                            <div className="flex flex-col gap-1 break-words">
                              <AutoSaveInput 
                                value={p.name} 
                                placeholder="Project Name..."
                                onSave={(v) => updateProjectField(p.id, 'name', v)} 
                                className={`w-full font-bold text-lg bg-transparent border-none outline-none focus:ring-0 ${colors.text} break-words whitespace-normal`} 
                              />
                              <div className="flex items-center gap-2 opacity-0 group-hover/row:opacity-100 transition duration-150 text-xs mt-2">
                                <button 
                                  onClick={() => updateProjectField(p.id, 'archived', !p.archived)} 
                                  className="text-slate-400 hover:text-amber-600 font-medium transition"
                                >
                                  {p.archived ? "Unarchive" : "Archive"}
                                </button>
                                <span className="text-slate-300">|</span>
                                <button 
                                  onClick={() => deleteProject(p.id)} 
                                  className="text-slate-400 hover:text-red-600 font-medium transition"
                                >
                                  Delete
                                </button>
                              </div>
                            </div>
                          </td>

                          {/* Dynamic Priority Toggle Cell */}
                          <td className="p-5 align-top">
                            <div className="flex flex-col gap-1">
                              <select 
                                value={p.priority} 
                                onChange={(e) => updateProjectField(p.id, 'priority', parseInt(e.target.value, 10))} 
                                className={`p-1.5 rounded text-sm bg-white border border-slate-200 outline-none font-bold text-center cursor-pointer w-full max-w-[120px]`}
                              >
                                {PRIORITIES.map(opt => (
                                  <option key={opt.level} value={opt.level}>
                                    {opt.label}
                                  </option>
                                ))}
                              </select>
                            </div>
                          </td>

                          {/* Category Selector */}
                          <td className="p-5 align-top">
                            <select 
                              value={p.category || 'None'} 
                              onChange={(e) => updateProjectField(p.id, 'category', e.target.value)} 
                              className={`p-2 rounded text-base bg-white border border-slate-200 outline-none font-semibold ${colors.text} cursor-pointer w-full max-w-[130px]`}
                            >
                              {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                          </td>

                          {/* Plain Status Field (Wraps completely) */}
                          <td className="p-5 align-top break-words">
                            <AutoResizeTextarea 
                              value={p.status || ''} 
                              placeholder="..."
                              onSave={(v) => updateProjectField(p.id, 'status', v)} 
                              className={`w-full text-base leading-relaxed p-1 ${colors.text} break-words whitespace-normal`}
                            />
                          </td>

                          {/* Next Steps List */}
                          <td className="p-5 align-top break-words">
                            {renderList(p, 'nextSteps', colors)}
                          </td>

                          {/* Notes List */}
                          <td className="p-5 align-top break-words">
                            {renderList(p, 'notes', colors)}
                          </td>

                          {/* Manual Reordering Controls */}
                          <td className="p-4 align-top text-center">
                            {isManualOrderingActive ? (
                              <div className="flex items-center justify-center gap-1.5 mt-1">
                                <button 
                                  onClick={() => moveProject(index, -1)}
                                  disabled={index === 0}
                                  className="p-1 text-slate-400 hover:text-amber-600 disabled:opacity-20 transition"
                                  title="Move Up"
                                >
                                  ▲
                                </button>
                                <button 
                                  onClick={() => moveProject(index, 1)}
                                  disabled={index === displayedProjects.length - 1}
                                  className="p-1 text-slate-400 hover:text-amber-600 disabled:opacity-20 transition"
                                  title="Move Down"
                                >
                                  ▼
                                </button>
                              </div>
                            ) : (
                              <div className="text-xs text-slate-400 font-medium italic mt-2" title="Manual reordering is disabled while active sort or filters are applied.">
                                Sorted
                              </div>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                    {displayedProjects.length === 0 && (
                      <tr>
                        <td colSpan="7" className="p-16 text-center text-slate-400">
                          <p className="mb-4 text-sm font-medium">
                            {showArchived ? "No archived projects match your filters." : "No projects match your current filter settings."}
                          </p>
                          {!showArchived && priorityFilter === 'all' && (
                            <button 
                              onClick={createProject} 
                              className="px-6 py-2 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded shadow transition"
                            >
                              Create Your First Project
                            </button>
                          )}
                        </td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>

              {displayedProjects.length > 0 && !showArchived && (
                <div className="p-5 border-t border-slate-100 bg-slate-50/50">
                  <button 
                    onClick={createProject} 
                    className="px-5 py-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-lg font-bold shadow hover:shadow-md transition"
                  >
                    + New Project
                  </button>
                </div>
              )}
            </div>
          </div>
        </ErrorBoundary>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
