<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Master Project Tracker - ADHD Focused Edition</title>
  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
  <!-- React and Babel compiler libraries -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Styling framework -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    textarea:focus, input:focus, select:focus {
      outline: none !important;
      box-shadow: none !important;
    }
    .custom-scrollbar::-webkit-scrollbar { height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="antialiased font-sans select-none sm:select-auto transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    (() => {
      const { useState, useEffect, useRef, useLayoutEffect } = React;

      // Sanitizer Guard & Character Limiter
      const sanitizeInput = (val, maxLen = null) => {
        if (typeof val !== 'string') return '';
        let cleaned = val.replace(/<[^>]*>?/gm, '').trimStart();
        if (maxLen && cleaned.length > maxLen) {
          cleaned = cleaned.slice(0, maxLen);
        }
        return cleaned;
      };

      // Firebase Configuration
      const firebaseConfig = {
        apiKey: "AIzaSyCiQU2ilhdlJkxD7-kWHl6lkO2LKQYnC7E",
        authDomain: "master-tracker-7b104.firebaseapp.com",
        projectId: "master-tracker-7b104",
        storageBucket: "master-tracker-7b104.firebasestorage.app",
        messagingSenderId: "706171177063",
        appId: "1:706171177063:web:ac2415157560969c5a6cc2"
      };

      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.firestore();

      db.enablePersistence({ synchronizeTabs: true }).catch((err) => {
        if (err.code !== 'failed-precondition' && err.code !== 'unimplemented') {
          console.warn("Firestore persistence warning:", err.code);
        }
      });

      const CATEGORIES = ['None', 'Personal', 'Career', 'Family', 'Spiritual', 'Financial', 'Learning'];

      const CATEGORY_COLORS = {
        'None': { border: 'border-l-slate-400', darkBg: 'bg-slate-900/40', lightBg: 'bg-slate-100/60', badge: 'bg-slate-500/20 text-slate-400 border-slate-500/30' },
        'Personal': { border: 'border-l-blue-500', darkBg: 'bg-blue-950/25', lightBg: 'bg-blue-50/80', badge: 'bg-blue-500/20 text-blue-400 border-blue-500/30' },
        'Career': { border: 'border-l-orange-500', darkBg: 'bg-orange-950/25', lightBg: 'bg-orange-50/80', badge: 'bg-orange-500/20 text-orange-400 border-orange-500/30' },
        'Family': { border: 'border-l-fuchsia-500', darkBg: 'bg-fuchsia-950/25', lightBg: 'bg-fuchsia-50/80', badge: 'bg-fuchsia-500/20 text-fuchsia-400 border-fuchsia-500/30' },
        'Spiritual': { border: 'border-l-green-500', darkBg: 'bg-green-950/25', lightBg: 'bg-green-50/80', badge: 'bg-green-500/20 text-green-400 border-green-500/30' },
        'Financial': { border: 'border-l-purple-500', darkBg: 'bg-purple-950/25', lightBg: 'bg-purple-50/80', badge: 'bg-purple-500/20 text-purple-400 border-purple-500/30' },
        'Learning': { border: 'border-l-pink-500', darkBg: 'bg-pink-950/25', lightBg: 'bg-pink-50/80', badge: 'bg-pink-500/20 text-pink-400 border-pink-500/30' }
      };

      const PRIORITIES = [
        { level: 0, label: 'Normal', badgeDark: 'bg-slate-800 text-slate-300 border-slate-700', badgeLight: 'bg-slate-200 text-slate-700 border-slate-300' },
        { level: 1, label: '❗ High', badgeDark: 'bg-amber-500/20 text-amber-300 border-amber-500/40', badgeLight: 'bg-amber-100 text-amber-800 border-amber-300' },
        { level: 2, label: '‼️ Urgent', badgeDark: 'bg-red-500/20 text-red-400 border-red-500/50 animate-pulse', badgeLight: 'bg-red-100 text-red-800 border-red-300' }
      ];

      const INITIAL_DEMO_PROJECTS = [
        {
          id: 'demo-1',
          name: 'Website Redesign & Launch',
          category: 'Career',
          priority: 2,
          orderIndex: 100,
          status: 'Approved hero copy and finalized brand color palette.',
          nextSteps: [
            { id: 'd1-1', text: 'Build responsive landing components', done: false },
            { id: 'd1-2', text: 'Configure custom domain SSL', done: true }
          ],
          notes: [{ id: 'dn1-1', text: 'Keep mobile JS bundle size under 50kb.', done: false }],
          archived: false
        },
        {
          id: 'demo-2',
          name: 'Fall Lawn Overseeding',
          category: 'Personal',
          priority: 1,
          orderIndex: 200,
          status: 'Core aerated and mowed lawn to 1.5 inches.',
          nextSteps: [
            { id: 'd2-1', text: 'Spread KBG seed blend and starter fertilizer', done: false },
            { id: 'd2-2', text: 'Set up automatic hose timer', done: true }
          ],
          notes: [{ id: 'dn2-1', text: 'Water 2x daily for 15 mins until germination.', done: false }],
          archived: false
        }
      ];

      const AutoSaveInput = ({ value, onSave, className, placeholder, maxLength }) => {
        const [val, setVal] = useState(value || '');
        const isFocused = useRef(false);

        useEffect(() => {
          if (!isFocused.current) setVal(value || '');
        }, [value]);

        const handleBlur = () => {
          isFocused.current = false;
          const cleaned = sanitizeInput(val, maxLength);
          if (cleaned !== value) onSave(cleaned);
        };

        return (
          <input 
            type="text"
            value={val}
            maxLength={maxLength}
            placeholder={placeholder}
            onFocus={() => { isFocused.current = true; }}
            onChange={(e) => setVal(e.target.value)}
            onBlur={handleBlur}
            onKeyDown={(e) => e.key === 'Enter' && e.target.blur()}
            className={`${className} bg-transparent border-none outline-none focus:ring-0 w-full truncate`}
          />
        );
      };

      const AutoResizeTextarea = ({ value, onSave, autoFocus, onFocused, className, placeholder, maxLength }) => {
        const textareaRef = useRef(null);
        const [val, setVal] = useState(value || '');
        const isFocused = useRef(false);

        useEffect(() => {
          if (!isFocused.current) setVal(value || '');
        }, [value]);
        
        useLayoutEffect(() => {
          const el = textareaRef.current;
          if (el) {
            el.style.height = 'auto';
            el.style.height = `${el.scrollHeight}px`;
          }
        }, [val]);

        useEffect(() => {
          if (autoFocus && textareaRef.current) {
            textareaRef.current.focus();
            const len = textareaRef.current.value.length;
            textareaRef.current.setSelectionRange(len, len);
            if (onFocused) onFocused();
          }
        }, [autoFocus]);

        const handleBlur = () => {
          isFocused.current = false;
          const cleaned = sanitizeInput(val, maxLength);
          if (cleaned !== value) onSave(cleaned);
        };

        return (
          <div className="relative w-full">
            <textarea 
              ref={textareaRef} 
              value={val} 
              maxLength={maxLength}
              placeholder={placeholder}
              onChange={(e) => setVal(e.target.value)}
              onFocus={() => { isFocused.current = true; }}
              onBlur={handleBlur} 
              className={`${className} resize-none overflow-hidden bg-transparent border-none focus:ring-0 p-0 break-words whitespace-normal block w-full`} 
              rows={1} 
            />
            {maxLength && val.length > maxLength * 0.8 && (
              <div className="text-[10px] text-amber-500 font-mono text-right opacity-80 mt-0.5">
                {val.length}/{maxLength}
              </div>
            )}
          </div>
        );
      };

      class ErrorBoundary extends React.Component {
        constructor(props) {
          super(props);
          this.state = { hasError: false };
        }
        static getDerivedStateFromError() { return { hasError: true }; }
        render() {
          if (this.state.hasError) {
            return (
              <div className="p-8 text-center">
                <h2 className="text-lg font-bold text-red-500">A workspace error occurred.</h2>
                <button onClick={() => window.location.reload()} className="mt-4 px-4 py-2 bg-amber-500 text-slate-950 rounded font-bold">Reload Workspace</button>
              </div>
            );
          }
          return this.props.children;
        }
      }

      function App() {
        const [user, setUser] = useState(null);
        const [loading, setLoading] = useState(true);
        const [projects, setProjects] = useState([]);
        const [focusId, setFocusId] = useState(null);
        const [showArchived, setShowArchived] = useState(false);
        const [expandedCompleted, setExpandedCompleted] = useState({});
        const [expandedMobileIds, setExpandedMobileIds] = useState({});
        
        // Dark / Light Theme state
        const [isDarkMode, setIsDarkMode] = useState(() => {
          return localStorage.getItem('tracker_theme') !== 'light';
        });

        const toggleTheme = () => {
          const next = !isDarkMode;
          setIsDarkMode(next);
          localStorage.setItem('tracker_theme', next ? 'dark' : 'light');
        };

        const [isDemoMode, setIsDemoMode] = useState(() => {
          const urlParams = new URLSearchParams(window.location.search);
          return urlParams.get('demo') === 'true';
        });

        useEffect(() => {
          return auth.onAuthStateChanged((u) => {
            setUser(u);
            if (u) setIsDemoMode(false);
            setLoading(false);
          });
        }, []);

        useEffect(() => {
          if (isDemoMode) {
            setProjects(JSON.parse(JSON.stringify(INITIAL_DEMO_PROJECTS)));
            return;
          }

          if (!user) {
            setProjects([]);
            return;
          }

          const unsubscribe = db.collection('users')
            .doc(user.uid)
            .collection('projects')
            .orderBy('orderIndex', 'asc')
            .onSnapshot(
              (snapshot) => {
                const updatedProjects = snapshot.docs.map(doc => {
                  const raw = doc.data();
                  return {
                    id: doc.id,
                    name: typeof raw.name === 'string' ? sanitizeInput(raw.name) : '',
                    category: typeof raw.category === 'string' ? raw.category : 'None',
                    priority: typeof raw.priority === 'number' ? raw.priority : 0,
                    orderIndex: typeof raw.orderIndex === 'number' ? raw.orderIndex : 0,
                    status: typeof raw.status === 'string' ? sanitizeInput(raw.status) : '',
                    nextSteps: Array.isArray(raw.nextSteps) ? raw.nextSteps.map(item => ({
                      ...item,
                      text: sanitizeInput(item.text || '')
                    })) : [],
                    notes: Array.isArray(raw.notes) ? raw.notes.map(item => ({
                      ...item,
                      text: sanitizeInput(item.text || '', 1000)
                    })) : [],
                    archived: !!raw.archived
                  };
                });

                setProjects(updatedProjects);
              },
              (err) => console.error("Realtime subscription error:", err.message)
            );

          return () => unsubscribe();
        }, [user, isDemoMode]);

        const getProjectDoc = (id) => {
          if (isDemoMode || !user) throw new Error("Unauthorized database mutation attempt.");
          return db.collection('users').doc(user.uid).collection('projects').doc(String(id));
        };

        const updateProjectField = (id, field, val) => {
          const maxLen = field === 'notes' ? 1000 : null;
          const sanitizedVal = typeof val === 'string' ? sanitizeInput(val, maxLen) : val;

          if (isDemoMode) {
            setProjects(prev => prev.map(p => p.id === id ? { ...p, [field]: sanitizedVal } : p));
            return;
          }

          if (!user) return;
          getProjectDoc(id).set({ [field]: sanitizedVal }, { merge: true })
            .catch(err => console.error("Update failed:", err.message));
        };

        const moveProject = (index, direction) => {
          const currentList = projects
            .filter(p => p.archived === showArchived)
            .sort((a, b) => (a.orderIndex || 0) - (b.orderIndex || 0));

          const targetIndex = direction === 'up' ? index - 1 : index + 1;

          if (targetIndex < 0 || targetIndex >= currentList.length) return;

          const currentProj = currentList[index];
          const targetProj = currentList[targetIndex];

          const tempOrder = currentProj.orderIndex;
          const newCurrentOrder = targetProj.orderIndex;
          const newTargetOrder = tempOrder === newCurrentOrder ? (direction === 'up' ? newCurrentOrder - 10 : newCurrentOrder + 10) : tempOrder;

          if (isDemoMode) {
            setProjects(prev => prev.map(p => {
              if (p.id === currentProj.id) return { ...p, orderIndex: newCurrentOrder };
              if (p.id === targetProj.id) return { ...p, orderIndex: newTargetOrder };
              return p;
            }));
            return;
          }

          if (!user) return;
          const batch = db.batch();
          batch.update(getProjectDoc(currentProj.id), { orderIndex: newCurrentOrder });
          batch.update(getProjectDoc(targetProj.id), { orderIndex: newTargetOrder });
          batch.commit().catch(err => console.error("Reorder failed:", err.message));
        };

        const createProject = () => {
          const maxOrder = projects.length > 0 ? Math.max(...projects.map(p => p.orderIndex || 0)) : 0;
          const newProj = {
            name: '',
            category: 'None',
            priority: 0,
            orderIndex: maxOrder + 100,
            status: '',
            nextSteps: [],
            notes: [],
            archived: false
          };

          if (isDemoMode) {
            const newId = `demo-${Date.now()}`;
            setProjects(prev => [...prev, { ...newProj, id: newId }]);
            setExpandedMobileIds(prev => ({ ...prev, [newId]: true }));
            return;
          }

          if (!user) return;
          db.collection('users').doc(user.uid).collection('projects').add(newProj)
            .then(docRef => {
              setExpandedMobileIds(prev => ({ ...prev, [docRef.id]: true }));
            })
            .catch(err => console.error("Creation failed:", err.message));
        };

        const deleteProject = (id) => {
          if (!confirm("Are you sure you want to permanently delete this project?")) return;
          if (isDemoMode) {
            setProjects(prev => prev.filter(p => p.id !== id));
            return;
          }
          if (!user) return;
          getProjectDoc(id).delete().catch(err => console.error("Deletion failed:", err.message));
        };

        const purgeProjectCompleted = (projectId) => {
          const target = projects.find(p => p.id === projectId);
          if (!target) return;

          const cleanedNextSteps = target.nextSteps.filter(s => !s.done);
          const cleanedNotes = target.notes.filter(n => !n.done);

          if (isDemoMode) {
            setProjects(prev => prev.map(p => p.id === projectId ? {
              ...p,
              nextSteps: cleanedNextSteps,
              notes: cleanedNotes
            } : p));
            return;
          }

          if (!user) return;
          getProjectDoc(projectId).set({
            nextSteps: cleanedNextSteps,
            notes: cleanedNotes
          }, { merge: true });
        };

        const purgeAllCompleted = () => {
          let totalCount = 0;
          projects.forEach(p => {
            totalCount += p.nextSteps.filter(s => s.done).length;
            totalCount += p.notes.filter(n => n.done).length;
          });

          if (totalCount === 0) {
            alert("No completed steps found to purge.");
            return;
          }

          if (!confirm(`Permanently remove ${totalCount} completed items across all active projects?`)) return;

          if (isDemoMode) {
            setProjects(prev => prev.map(p => ({
              ...p,
              nextSteps: p.nextSteps.filter(s => !s.done),
              notes: p.notes.filter(n => !n.done)
            })));
            return;
          }

          if (!user) return;
          const batch = db.batch();
          projects.forEach(p => {
            const docRef = getProjectDoc(p.id);
            batch.update(docRef, {
              nextSteps: p.nextSteps.filter(s => !s.done),
              notes: p.notes.filter(n => !n.done)
            });
          });
          batch.commit().catch(err => console.error("Global purge failed:", err.message));
        };

        const toggleShowCompleted = (key) => {
          setExpandedCompleted(prev => ({ ...prev, [key]: !prev[key] }));
        };

        const renderList = (project, field, isMuted = false) => {
          const list = project[field] || [];
          const activeItems = list.filter(item => !item.done);
          const completedItems = list.filter(item => item.done);
          const expandKey = `${project.id}-${field}`;
          const isExpanded = !!expandedCompleted[expandKey];
          const maxLen = field === 'notes' ? 1000 : null;

          const renderItemRow = (item, originalIdx) => (
            <div key={item.id || originalIdx} className={`flex items-start gap-2 group py-1 border-b last:border-0 ${isDarkMode ? 'border-slate-800/40' : 'border-slate-200/80'}`}>
              <input 
                type="checkbox" 
                checked={item.done || false} 
                onChange={(e) => {
                  const newList = [...list];
                  newList[originalIdx] = { ...newList[originalIdx], done: e.target.checked };
                  updateProjectField(project.id, field, newList);
                }} 
                className={`mt-1 h-4 w-4 rounded border text-amber-500 focus:ring-amber-500/30 cursor-pointer flex-shrink-0 ${isDarkMode ? 'border-slate-700 bg-slate-900' : 'border-slate-300 bg-white'}`}
              />
              <AutoResizeTextarea
                value={item.text || ''}
                placeholder="..."
                maxLength={maxLen}
                autoFocus={focusId === item.id}
                onFocused={() => setFocusId(null)}
                onSave={(v) => {
                  const newList = [...list];
                  newList[originalIdx] = { ...newList[originalIdx], text: sanitizeInput(v, maxLen) };
                  updateProjectField(project.id, field, newList);
                }}
                className={`flex-1 text-sm leading-relaxed ${item.done ? (isDarkMode ? 'line-through text-slate-500' : 'line-through text-slate-400') : isMuted ? (isDarkMode ? 'text-slate-300 group-hover:text-slate-100' : 'text-slate-700 group-hover:text-slate-900') : (isDarkMode ? 'text-slate-100' : 'text-slate-800')}`}
              />
            </div>
          );

          return (
            <div className="flex flex-col text-sm break-words">
              {activeItems.map(item => {
                const originalIdx = list.findIndex(i => i.id === item.id);
                return renderItemRow(item, originalIdx);
              })}

              <button 
                onClick={() => {
                  const newId = `item-${Date.now()}`;
                  const newList = [...list, { id: newId, text: '', done: false }];
                  setFocusId(newId);
                  updateProjectField(project.id, field, newList);
                }} 
                className="text-xs text-amber-500 hover:text-amber-400 font-bold transition flex items-center gap-1 mt-1.5 py-0.5 opacity-90 hover:opacity-100"
              >
                + Add Step
              </button>

              {completedItems.length > 0 && (
                <div className={`mt-2 pt-1 border-t ${isDarkMode ? 'border-slate-800/60' : 'border-slate-200'}`}>
                  <button 
                    onClick={() => toggleShowCompleted(expandKey)}
                    className={`text-[11px] font-semibold transition flex items-center gap-1 ${isDarkMode ? 'text-slate-400 hover:text-slate-200' : 'text-slate-500 hover:text-slate-800'}`}
                  >
                    <span>{isExpanded ? '▼' : '▶'}</span>
                    <span>{isExpanded ? 'Hide' : 'Show'} {completedItems.length} completed</span>
                  </button>

                  {isExpanded && (
                    <div className={`mt-1 pl-2 border-l-2 space-y-1 ${isDarkMode ? 'border-slate-800' : 'border-slate-300'}`}>
                      {completedItems.map(item => {
                        const originalIdx = list.findIndex(i => i.id === item.id);
                        return renderItemRow(item, originalIdx);
                      })}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        };

        if (loading) return <div className={`h-screen flex items-center justify-center font-mono text-sm ${isDarkMode ? 'bg-slate-950 text-slate-400' : 'bg-slate-50 text-slate-600'}`}>Connecting Hardened Workspace...</div>;

        if (!user && !isDemoMode) {
          return (
            <div className={`min-h-screen flex flex-col lg:flex-row font-sans ${isDarkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-50 text-slate-900'}`}>
              <div className="flex-1 p-8 sm:p-12 lg:p-16 flex flex-col justify-between items-start max-w-7xl mx-auto w-full">
                <div>
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 text-amber-500 border border-amber-500/20 text-xs font-semibold mb-6">
                    <span className="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                    ADHD Focused Workspace Architecture
                  </div>
                  <h1 className="text-3xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight leading-tight mb-4">
                    Master Project Tracker
                  </h1>
                  <p className={`text-base sm:text-lg max-w-2xl leading-relaxed mb-10 ${isDarkMode ? 'text-slate-300' : 'text-slate-600'}`}>
                    Low-friction execution environment designed to eliminate cognitive re-entry friction. Clear status context, wide action targets, zero visual clutter.
                  </p>
                </div>
                <div className="text-xs text-slate-500 font-mono">
                  Zero Overwhelm • Hardened Storage Architecture
                </div>
              </div>

              <div className={`w-full lg:w-[440px] border-t lg:border-t-0 lg:border-l p-8 sm:p-12 flex items-center justify-center ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                <div className="w-full max-w-sm text-center">
                  <h2 className="text-2xl sm:text-3xl font-extrabold mb-3">Get Started</h2>
                  <p className={`text-xs sm:text-sm mb-8 ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>Sign in to save your workspace or enter sandbox mode.</p>
                  
                  <button 
                    onClick={() => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}
                    className="w-full py-3.5 px-4 bg-slate-900 text-white dark:bg-white dark:text-slate-950 font-bold rounded-lg shadow hover:opacity-90 transition text-sm flex items-center justify-center gap-3 mb-4"
                  >
                    Continue with Google
                  </button>

                  <button 
                    onClick={() => setIsDemoMode(true)}
                    className="w-full py-3 px-4 bg-transparent hover:bg-amber-500/10 text-amber-500 font-bold rounded-lg border border-amber-500/40 transition text-sm"
                  >
                    Enter Sandbox Demo Mode
                  </button>
                </div>
              </div>
            </div>
          );
        }

        const displayedProjects = projects
          .filter(p => p.archived === showArchived)
          .sort((a, b) => (a.orderIndex || 0) - (b.orderIndex || 0));

        return (
          <ErrorBoundary>
            <div className={`min-h-screen ${isDarkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-100 text-slate-900'}`}>
              {isDemoMode && (
                <div className="bg-amber-500 text-slate-950 text-xs font-bold px-4 py-2 flex items-center justify-between shadow">
                  <span>⚡ Sandbox Demo Mode: Changes persist in memory and reset on refresh.</span>
                  <button onClick={() => setIsDemoMode(false)} className="bg-slate-950 text-white px-3 py-0.5 rounded text-xs font-extrabold">
                    Exit Demo
                  </button>
                </div>
              )}

              <div className="p-4 md:p-6 max-w-[1500px] mx-auto">
                <div className="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div className="flex items-center gap-4">
                    <h1 className="text-2xl font-black tracking-tight">Workspace</h1>
                    <span className={`text-xs px-2.5 py-1 rounded-md font-mono border ${isDarkMode ? 'bg-slate-900 border-slate-800 text-slate-400' : 'bg-white border-slate-300 text-slate-600'}`}>
                      {isDemoMode ? 'sandbox@local' : user?.email}
                    </span>
                  </div>

                  <div className="flex flex-wrap gap-2 items-center">
                    {/* Dark/Light Mode Switcher */}
                    <button 
                      onClick={toggleTheme}
                      className={`px-3 py-1.5 text-xs rounded-lg font-bold border transition flex items-center gap-1.5 ${isDarkMode ? 'border-slate-800 bg-slate-900 text-amber-400 hover:bg-slate-800' : 'border-slate-300 bg-white text-slate-800 hover:bg-slate-50'}`}
                      title="Toggle visual theme"
                    >
                      {isDarkMode ? '☀️ Light' : '🌙 Dark'}
                    </button>

                    <button 
                      onClick={purgeAllCompleted}
                      className={`px-3.5 py-1.5 text-xs rounded-lg font-bold border transition ${isDarkMode ? 'border-slate-800 bg-slate-900/80 text-slate-300 hover:text-amber-400 hover:border-amber-500/40' : 'border-slate-300 bg-white text-slate-700 hover:text-amber-600 hover:border-amber-500'}`}
                    >
                      🧹 Purge All Completed
                    </button>

                    <button 
                      onClick={() => setShowArchived(!showArchived)} 
                      className={`px-3.5 py-1.5 text-xs rounded-lg font-bold border transition ${isDarkMode ? 'border-slate-800 bg-slate-900 text-slate-300 hover:text-white' : 'border-slate-300 bg-white text-slate-700 hover:text-slate-950'}`}
                    >
                      {showArchived ? "View Active" : "View Archived"}
                    </button>

                    {!isDemoMode && (
                      <button 
                        onClick={() => auth.signOut()} 
                        className={`px-3.5 py-1.5 text-xs border rounded-lg font-semibold transition ${isDarkMode ? 'border-slate-800 text-slate-400 hover:text-red-400' : 'border-slate-300 text-slate-600 hover:text-red-600'}`}
                      >
                        Sign Out
                      </button>
                    )}
                  </div>
                </div>

                {/* MOBILE VIEW */}
                <div className="block md:hidden space-y-3">
                  {displayedProjects.map((p, index) => {
                    const colorScheme = CATEGORY_COLORS[p.category] || CATEGORY_COLORS['None'];
                    const priorityMeta = PRIORITIES.find(pr => pr.level === p.priority) || PRIORITIES[0];
                    const isExpanded = !!expandedMobileIds[p.id];

                    return (
                      <div key={p.id} className={`rounded-xl border shadow-sm overflow-hidden border-l-4 ${colorScheme.border} ${isDarkMode ? colorScheme.darkBg + ' border-slate-800' : colorScheme.lightBg + ' border-slate-300'}`}>
                        <div className="p-4 flex items-center justify-between gap-2">
                          <div className="flex items-center gap-1.5 pr-1">
                            <div className="flex flex-col text-[10px] text-slate-400 font-bold">
                              <button onClick={() => moveProject(index, 'up')} disabled={index === 0} className="hover:text-amber-500 disabled:opacity-20 px-1 py-0.5">▲</button>
                              <button onClick={() => moveProject(index, 'down')} disabled={index === displayedProjects.length - 1} className="hover:text-amber-500 disabled:opacity-20 px-1 py-0.5">▼</button>
                            </div>
                          </div>

                          <div className="flex-1 min-w-0">
                            <AutoSaveInput 
                              value={p.name} 
                              placeholder="Project Name..."
                              onSave={(v) => updateProjectField(p.id, 'name', v)} 
                              className={`w-full font-bold text-base ${isDarkMode ? 'text-white' : 'text-slate-900'}`} 
                            />
                            <div className="flex items-center gap-2 mt-2">
                              <select 
                                value={p.priority} 
                                onChange={(e) => updateProjectField(p.id, 'priority', parseInt(e.target.value, 10))} 
                                className={`text-xs px-2 py-1 rounded font-bold border ${isDarkMode ? 'bg-slate-900 border-slate-800 text-slate-200' : 'bg-white border-slate-300 text-slate-800'}`}
                              >
                                {PRIORITIES.map(opt => <option key={opt.level} value={opt.level}>{opt.label}</option>)}
                              </select>
                              <select 
                                value={p.category || 'None'} 
                                onChange={(e) => updateProjectField(p.id, 'category', e.target.value)} 
                                className={`text-xs px-2 py-1 rounded font-semibold border ${isDarkMode ? 'bg-slate-900 border-slate-800 text-slate-200' : 'bg-white border-slate-300 text-slate-800'}`}
                              >
                                {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                              </select>
                            </div>
                          </div>

                          <button 
                            onClick={() => setExpandedMobileIds(prev => ({ ...prev, [p.id]: !prev[p.id] }))}
                            className={`p-2 rounded-lg font-bold text-sm border ${isDarkMode ? 'bg-slate-900 border-slate-800 text-slate-300' : 'bg-white border-slate-300 text-slate-700'}`}
                          >
                            {isExpanded ? '▲' : '▼'}
                          </button>
                        </div>

                        {isExpanded && (
                          <div className={`p-4 border-t space-y-4 ${isDarkMode ? 'border-slate-800/80 bg-slate-950/60' : 'border-slate-200 bg-white/80'}`}>
                            <div>
                              <div className="text-[11px] font-black uppercase tracking-wider text-amber-500 mb-1">Status Brief</div>
                              <AutoResizeTextarea 
                                value={p.status || ''} 
                                placeholder="..."
                                onSave={(v) => updateProjectField(p.id, 'status', v)} 
                                className={`w-full text-sm leading-relaxed ${isDarkMode ? 'text-slate-200' : 'text-slate-800'}`}
                              />
                            </div>

                            <div>
                              <div className="text-[11px] font-black uppercase tracking-wider text-amber-500 mb-1">Next Steps</div>
                              {renderList(p, 'nextSteps')}
                            </div>

                            <div>
                              <div className="text-[11px] font-black uppercase tracking-wider text-slate-400 mb-1">Notes</div>
                              {renderList(p, 'notes', true)}
                            </div>

                            <div className={`pt-2 border-t flex items-center justify-between text-xs ${isDarkMode ? 'border-slate-800' : 'border-slate-200'}`}>
                              <button onClick={() => purgeProjectCompleted(p.id)} className="text-slate-500 hover:text-amber-500 font-semibold">
                                Clean Done
                              </button>
                              <div className="flex gap-3">
                                <button onClick={() => updateProjectField(p.id, 'archived', !p.archived)} className="text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 font-semibold">
                                  {p.archived ? "Unarchive" : "Archive"}
                                </button>
                                <button onClick={() => deleteProject(p.id)} className="text-slate-500 hover:text-red-500 font-semibold">
                                  Delete
                                </button>
                              </div>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>

                {/* DESKTOP HIGH-DENSITY TABLE */}
                <div className={`hidden md:block rounded-xl border shadow-sm overflow-hidden ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-300'}`}>
                  <table className="w-full text-left border-collapse min-w-[1280px] table-fixed">
                    <thead className="bg-amber-500 text-slate-950 text-xs font-black uppercase tracking-wider">
                      <tr>
                        <th className="p-3.5 w-[22%] border-r border-amber-600/30">Project Name</th>
                        <th className="p-3.5 w-[20%] border-r border-amber-600/30">Status Brief</th>
                        <th className="p-3.5 w-[30%] border-r-2 border-slate-700">Next Steps</th>
                        <th className="p-3.5 w-[13%] border-r border-amber-600/30">Details</th>
                        <th className="p-3.5 w-[15%]">Notes</th>
                      </tr>
                    </thead>
                    <tbody className={`divide-y ${isDarkMode ? 'divide-slate-800/80' : 'divide-slate-200'}`}>
                      {displayedProjects.map((p, index) => {
                        const colorScheme = CATEGORY_COLORS[p.category] || CATEGORY_COLORS['None'];
                        const priorityMeta = PRIORITIES.find(pr => pr.level === p.priority) || PRIORITIES[0];

                        return (
                          <tr key={p.id} className={`transition group border-b border-l-4 ${colorScheme.border} ${isDarkMode ? colorScheme.darkBg + ' border-slate-800 hover:bg-slate-800/50' : colorScheme.lightBg + ' border-slate-200 hover:bg-slate-100'}`}>
                            
                            {/* Project Name Cell */}
                            <td className="p-3.5 align-top">
                              <div className="flex items-start gap-2">
                                <div className="flex flex-col text-[10px] text-slate-400 font-bold pt-0.5 opacity-40 group-hover:opacity-100 transition">
                                  <button 
                                    onClick={() => moveProject(index, 'up')} 
                                    disabled={index === 0} 
                                    className="hover:text-amber-500 leading-none p-0.5 disabled:opacity-20"
                                    title="Move project up"
                                  >
                                    ▲
                                  </button>
                                  <button 
                                    onClick={() => moveProject(index, 'down')} 
                                    disabled={index === displayedProjects.length - 1} 
                                    className="hover:text-amber-500 leading-none p-0.5 disabled:opacity-20"
                                    title="Move project down"
                                  >
                                    ▼
                                  </button>
                                </div>

                                <div className="flex-1 min-w-0">
                                  <AutoSaveInput 
                                    value={p.name} 
                                    placeholder="Project Name..."
                                    onSave={(v) => updateProjectField(p.id, 'name', v)} 
                                    className={`font-bold text-base ${isDarkMode ? 'text-white' : 'text-slate-900'}`} 
                                  />

                                  <div className="mt-2 flex items-center gap-2 text-[11px]">
                                    <button 
                                      onClick={() => purgeProjectCompleted(p.id)}
                                      className="text-slate-400 hover:text-amber-500 transition font-semibold"
                                      title="Purge completed items in this project"
                                    >
                                      🧹 Purge
                                    </button>
                                    <span className="text-slate-400">•</span>
                                    <button 
                                      onClick={() => updateProjectField(p.id, 'archived', !p.archived)} 
                                      className="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition font-semibold"
                                    >
                                      {p.archived ? "Unarchive" : "Archive"}
                                    </button>
                                    <span className="text-slate-400">•</span>
                                    <button 
                                      onClick={() => deleteProject(p.id)} 
                                      className="text-slate-400 hover:text-red-500 transition font-semibold"
                                    >
                                      Delete
                                    </button>
                                  </div>
                                </div>
                              </div>
                            </td>

                            {/* Status Brief */}
                            <td className="p-3.5 align-top">
                              <AutoResizeTextarea 
                                value={p.status || ''} 
                                placeholder="..."
                                onSave={(v) => updateProjectField(p.id, 'status', v)} 
                                className={`text-sm leading-relaxed ${isDarkMode ? 'text-slate-200' : 'text-slate-800'}`}
                              />
                            </td>

                            {/* Next Steps */}
                            <td className={`p-3.5 align-top border-r-2 ${isDarkMode ? 'border-slate-800 bg-slate-950/20' : 'border-slate-200 bg-white/40'}`}>
                              {renderList(p, 'nextSteps')}
                            </td>

                            {/* Details (Category & Priority) */}
                            <td className="p-3.5 align-top">
                              <div className="space-y-3">
                                <div>
                                  <label className="text-[10px] uppercase font-mono text-slate-400 block mb-1">Priority</label>
                                  <select 
                                    value={p.priority} 
                                    onChange={(e) => updateProjectField(p.id, 'priority', parseInt(e.target.value, 10))} 
                                    className={`text-xs p-1.5 rounded font-bold border w-full cursor-pointer ${isDarkMode ? priorityMeta.badgeDark : priorityMeta.badgeLight}`}
                                  >
                                    {PRIORITIES.map(opt => <option key={opt.level} value={opt.level}>{opt.label}</option>)}
                                  </select>
                                </div>

                                <div>
                                  <label className="text-[10px] uppercase font-mono text-slate-400 block mb-1">Category Domain</label>
                                  <select 
                                    value={p.category || 'None'} 
                                    onChange={(e) => updateProjectField(p.id, 'category', e.target.value)} 
                                    className={`text-xs p-1.5 rounded font-bold border w-full cursor-pointer ${colorScheme.badge}`}
                                  >
                                    {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                                  </select>
                                </div>
                              </div>
                            </td>

                            {/* Notes */}
                            <td className="p-3.5 align-top">
                              {renderList(p, 'notes', true)}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>

                {!showArchived && (
                  <button 
                    onClick={createProject} 
                    className="w-full mt-4 py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-sm rounded-xl shadow transition tracking-wide"
                  >
                    + New Project
                  </button>
                )}
              </div>
            </div>
          </ErrorBoundary>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    })();
  </script>
</body>
</html>
