<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Project Tracker</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const { useState, useEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyCiQU2ilhdlJkxD7-kWHl6lkO2LKQYnC7E",
      authDomain: "master-tracker-7b104.firebaseapp.com",
      projectId: "master-tracker-7b104",
      storageBucket: "master-tracker-7b104.firebasestorage.app",
      messagingSenderId: "706171177063",
      appId: "1:706171177063:web:ac2415157560969c5a6cc2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    const CATEGORY_COLORS = {
      'Personal': 'bg-blue-100 text-blue-800',
      'Career': 'bg-amber-100 text-amber-900',
      'Family': 'bg-pink-100 text-pink-800',
      'Spiritual': 'bg-green-100 text-green-800',
      'Financial': 'bg-purple-100 text-purple-800',
      '': 'bg-slate-100 text-slate-500'
    };

    const AutoResizeTextarea = ({ value, onSave, className, minRows = 1 }) => {
      const [localValue, setLocalValue] = useState(value);
      useEffect(() => setLocalValue(value), [value]);
      const resize = (t) => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; };
      return <textarea value={localValue} onChange={(e) => { setLocalValue(e.target.value); resize(e.target); }} onBlur={(e) => { if (localValue !== value) onSave(localValue); }} onFocus={(e) => resize(e.target)} className={className} rows={minRows} />;
    };

    function App() {
      const [user, setUser] = useState(null);
      const [projects, setProjects] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, (u) => { setUser(u); setLoading(false); });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        const unsubscribe = onSnapshot(collection(db, 'users', user.uid, 'projects'), (snap) => {
          setProjects(snap.docs.map(d => d.data()).sort((a,b) => b.id - a.id));
        });
        return () => unsubscribe();
      }, [user]);

      const addProject = async () => {
        const id = Date.now();
        await setDoc(doc(db, 'users', user.uid, 'projects', id.toString()), { id, name: 'New Project', category: '', status: '', nextSteps: '', notes: '' });
      };

      const updateProject = async (id, field, val) => await updateDoc(doc(db, 'users', user.uid, 'projects', id.toString()), { [field]: val });

      if (loading) return <div className="p-8">Loading...</div>;
      if (!user) return <div className="p-8"><button onClick={() => signInWithPopup(auth, googleProvider)} className="bg-blue-600 text-white p-2 rounded">Login</button></div>;

      return (
        <div className="min-h-screen bg-slate-50 p-6 font-sans text-slate-900">
          <div className="max-w-[1400px] mx-auto bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <table className="w-full text-left border-collapse table-fixed">
              <thead>
                <tr className="bg-amber-400 text-amber-950 text-[10px] uppercase tracking-widest border-b border-amber-500/20">
                  <th className="p-3 w-[15%] border-r border-amber-500/20">Project</th>
                  <th className="p-3 w-[10%] border-r border-amber-500/20">Category</th>
                  <th className="p-3 w-[25%] border-r border-amber-500/20">Status</th>
                  <th className="p-3 w-[25%] border-r border-amber-500/20">Steps</th>
                  <th className="p-3 w-[25%]">Notes</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {projects.map(p => (
                  <tr key={p.id} className="hover:bg-slate-50">
                    <td className="p-3 border-r"><AutoResizeTextarea value={p.name} onSave={(v) => updateProject(p.id, 'name', v)} className="w-full font-bold bg-transparent resize-none outline-none" /></td>
                    <td className="p-3 border-r">
                      <select value={p.category} onChange={(e) => updateProject(p.id, 'category', e.target.value)} className={`text-[10px] font-bold p-1 rounded w-full ${CATEGORY_COLORS[p.category] || ''}`}>
                        <option value="">None</option>
                        <option value="Personal">Personal</option>
                        <option value="Career">Career</option>
                        <option value="Family">Family</option>
                      </select>
                    </td>
                    <td className="p-3 border-r"><AutoResizeTextarea value={p.status} onSave={(v) => updateProject(p.id, 'status', v)} className="w-full text-xs bg-transparent resize-none outline-none" minRows={2} /></td>
                    <td className="p-3 border-r"><AutoResizeTextarea value={p.nextSteps} onSave={(v) => updateProject(p.id, 'nextSteps', v)} className="w-full text-xs bg-transparent resize-none outline-none" minRows={2} /></td>
                    <td className="p-3"><AutoResizeTextarea value={p.notes} onSave={(v) => updateProject(p.id, 'notes', v)} className="w-full text-xs bg-transparent resize-none outline-none" minRows={2} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="p-4 border-t">
              <button onClick={addProject} className="text-xs font-bold text-blue-600 hover:underline">+ ADD PROJECT</button>
            </div>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
