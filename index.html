    const normalizeSteps = (items) => {
      if (!Array.isArray(items)) return [];
      return items.map((item, idx) => {
        if (!item) return { id: `step-${Date.now()}-${idx}`, text: '', completed: false, indent: 0 };
        if (typeof item === 'string') return { id: `step-${Date.now()}-${idx}`, text: item.slice(0, MAX_NOTE_LENGTH), completed: false, indent: 0 };
        return {
          id: item.id || `step-${Date.now()}-${idx}`,
          text: (item.text || '').slice(0, MAX_NOTE_LENGTH),
          completed: !!(item.completed || item.done),
          indent: typeof item.indent === 'number' ? Math.max(0, Math.min(2, item.indent)) : 0
        };
      });
    };

    // --- REFINED AUTO-SAVE COMPONENTS ---
    const AutoSaveInput = ({ value, onSave, placeholder, className, maxLength = MAX_NAME_LENGTH }) => {
      const [val, setVal] = useState(value || '');
      const timerRef = useRef(null);

      useEffect(() => setVal(value || ''), [value]);

      const debouncedSave = (newValue) => {
        if (timerRef.current) clearTimeout(timerRef.current);
        timerRef.current = setTimeout(() => {
          if (newValue !== value) onSave(newValue);
        }, 300);
      };

      const handleChange = (e) => {
        let text = e.target.value;
        if (maxLength && text.length > maxLength) text = text.slice(0, maxLength);
        setVal(text);
        debouncedSave(text);
      };

      const handlePaste = (e) => {
        e.preventDefault();
        const plainText = (e.clipboardData || window.clipboardData).getData('text/plain');
        let text = plainText;
        if (maxLength && text.length > maxLength) text = text.slice(0, maxLength);
        setVal(text);
        debouncedSave(text);
      };

      return (
        <input
          type="text"
          value={val}
          maxLength={maxLength}
          placeholder={placeholder}
          onChange={handleChange}
          onPaste={handlePaste}
          onBlur={() => {
            if (timerRef.current) clearTimeout(timerRef.current);
            if (val !== value) onSave(val);
          }}
          className={`bg-transparent w-full focus:outline-none focus:border-b-2 focus:border-amber-500 py-1 transition-colors ${className}`}
        />
      );
    };

    // Auto-expanding textarea that displays all content without scrollbars or cutoffs
    const AutoResizeTextarea = ({ value, onSave, onKeyDown, id, placeholder, className, maxLength = MAX_NOTE_LENGTH, onFocus }) => {
      const [val, setVal] = useState(value || '');
      const textareaRef = useRef(null);
      const timerRef = useRef(null);

      useEffect(() => setVal(value || ''), [value]);

      useLayoutEffect(() => {
        if (textareaRef.current) {
          textareaRef.current.style.height = 'auto';
          textareaRef.current.style.height = `${textareaRef.current.scrollHeight}px`;
        }
      }, [val]);

      const debouncedSave = (newValue) => {
        if (timerRef.current) clearTimeout(timerRef.current);
        timerRef.current = setTimeout(() => {
          if (newValue !== value) onSave(newValue);
        }, 300);
      };

      const handleChange = (e) => {
        let text = e.target.value;
        if (maxLength && text.length > maxLength) text = text.slice(0, maxLength);
        setVal(text);
        debouncedSave(text);
      };

      const handlePaste = (e) => {
        e.preventDefault();
        const plainText = (e.clipboardData || window.clipboardData).getData('text/plain');
        let text = plainText;
        if (maxLength && text.length > maxLength) text = text.slice(0, maxLength);
        setVal(text);
        debouncedSave(text);
      };

      return (
        <div className="relative w-full">
          <textarea
            id={id}
            ref={textareaRef}
            rows={1}
            value={val}
            maxLength={maxLength}
            placeholder={placeholder}
            onFocus={onFocus}
            onChange={handleChange}
            onKeyDown={(e) => { if (onKeyDown) onKeyDown(e, val); }}
            onPaste={handlePaste}
            onBlur={() => {
              if (timerRef.current) clearTimeout(timerRef.current);
              if (val !== value) onSave(val);
            }}
            className={`bg-transparent w-full focus:outline-none focus:border-b-2 focus:border-amber-500 py-1 leading-relaxed border-none resize-none overflow-hidden break-words whitespace-pre-wrap ${className}`}
          />
        </div>
      );
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('tracker_theme') === 'dark');
      const [currentView, setCurrentView] = useState('active');
      const [projects, setProjects] = useState([]);
      const [loading, setLoading] = useState(true);
      const [user, setUser] = useState(null);
      
      const [isDemoMode, setIsDemoMode] = useState(false);
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [hasPendingWrites, setHasPendingWrites] = useState(false);

      // HIDE COMPLETED TOGGLE FOR SUB-STEPS
      const [hideCompletedDone, setHideCompletedDone] = useState(false);
      const [priorityFilter, setPriorityFilter] = useState('all');
      const [sortBy, setSortBy] = useState('manual');

      // Mobile UI States
      const [expandedProjectId, setExpandedProjectId] = useState(null);
      const [activeStepId, setActiveStepId] = useState(null);

      useEffect(() => {
        const handleOnline = () => setIsOnline(true);
        const handleOffline = () => setIsOnline(false);
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, []);

      useEffect(() => {
        if (!isFirebaseConfigured || !auth) {
          setLoading(false);
          return;
        }
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          if (!currentUser && !isDemoMode) {
            setProjects([]);
            setLoading(false);
          }
        });
        return () => unsubscribe();
      }, [isDemoMode]);

      useEffect(() => {
        if (isDemoMode) {
          setLoading(false);
          return;
        }

        if (!user || !db) return;
        setLoading(true);
        
        const userProjectsRef = db.collection('users').doc(user.uid).collection('projects');
        const unsubscribe = userProjectsRef.onSnapshot((snapshot) => {
          setHasPendingWrites(snapshot.metadata.hasPendingWrites);
          let loaded = snapshot.docs.map(doc => {
            const data = doc.data();
            return {
              id: doc.id,
              name: typeof data.name === 'string' ? data.name : '',
              briefStatus: typeof data.briefStatus === 'string' ? data.briefStatus : '',
              category: typeof data.category === 'string' ? data.category : 'None',
              priority: typeof data.priority === 'number' ? data.priority : 0,
              status: typeof data.status === 'string' ? data.status : 'active',
              archived: !!data.archived,
              orderIndex: typeof data.orderIndex === 'number' ? data.orderIndex : (typeof data.order === 'number' ? data.order : 0),
              nextSteps: normalizeSteps(data.nextSteps),
              notes: normalizeSteps(data.notes)
            };
          });

          setProjects(loaded);
          setLoading(false);
        }, (err) => {
          console.error("Firestore sync error:", err);
          setLoading(false);
        });

        return () => unsubscribe();
      }, [user, isDemoMode]);

      useEffect(() => {
        localStorage.setItem('tracker_theme', isDarkMode ? 'dark' : 'light');
        if (isDarkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [isDarkMode]);

      const handleGoogleLogin = async () => {
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          await auth.signInWithPopup(provider);
          setIsDemoMode(false);
        } catch (err) {
          alert("Sign in failed: " + err.message);
        }
      };

      const handleLogout = () => {
        if (confirm("Sign out of your workspace?")) {
          auth.signOut();
          setIsDemoMode(false);
        }
      };

      const enableDemoMode = () => {
        setIsDemoMode(true);
        setProjects(DEMO_PROJECTS);
      };

      const updateProjectField = (id, field, value) => {
        if (isDemoMode) {
          setProjects(prev => prev.map(p => p.id === id ? { ...p, [field]: value } : p));
          return;
        }
        if (!user || !db) return;
        db.collection('users').doc(user.uid).collection('projects').doc(id).update({ [field]: value });
      };

      const addProject = () => {
        const maxOrder = projects.length > 0 ? Math.max(...projects.map(p => p.orderIndex || 0)) : 0;
        const newProj = {
          name: 'New Project',
          briefStatus: '',
          category: 'None',
          priority: 0,
          status: 'active',
          archived: false,
          orderIndex: maxOrder + 100,
          nextSteps: [{ id: `step-${Date.now()}`, text: '', completed: false, indent: 0 }],
          notes: []
        };

        if (isDemoMode) {
          setProjects([...projects, { id: `demo-${Date.now()}`, ...newProj }]);
          return;
        }
        if (!user || !db) return;
        db.collection('users').doc(user.uid).collection('projects').add(newProj);
      };

      const setProjectStatus = (id, newStatus) => {
        if (isDemoMode) {
          setProjects(prev => prev.map(p => p.id === id ? { ...p, status: newStatus, archived: newStatus === 'completed' } : p));
          return;
        }
        if (!user || !db) return;
        db.collection('users').doc(user.uid).collection('projects').doc(id).update({ 
          status: newStatus, 
          archived: newStatus === 'completed' 
        });
      };

      const deleteProject = (id) => {
        if (!confirm('Permanently delete this project?')) return;
        if (isDemoMode) {
          setProjects(prev => prev.filter(p => p.id !== id));
          return;
        }
        if (!user || !db) return;
        db.collection('users').doc(user.uid).collection('projects').doc(id).delete();
      };

      const moveProject = (indexInView, direction) => {
        const viewProjects = displayedProjects;
        const targetViewIndex = direction === 'up' ? indexInView - 1 : indexInView + 1;
        if (targetViewIndex < 0 || targetViewIndex >= viewProjects.length) return;

        const p1 = viewProjects[indexInView];
        const p2 = viewProjects[targetViewIndex];
        const tempIndex = p1.orderIndex || 0;
        const targetIndex = p2.orderIndex || 0;

        if (isDemoMode) {
          setProjects(prev => prev.map(p => {
            if (p.id === p1.id) return { ...p, orderIndex: targetIndex };
            if (p.id === p2.id) return { ...p, orderIndex: tempIndex };
            return p;
          }));
          return;
        }

        if (!user || !db) return;
        const batch = db.batch();
        batch.update(db.collection('users').doc(user.uid).collection('projects').doc(p1.id), { orderIndex: targetIndex });
        batch.update(db.collection('users').doc(user.uid).collection('projects').doc(p2.id), { orderIndex: tempIndex });
        batch.commit();
      };

      const purgeProjectSubSteps = (projectId, field) => {
        const proj = projects.find(p => p.id === projectId);
        if (!proj) return;
        const remaining = (proj[field] || []).filter(s => !s.completed);
        updateProjectField(projectId, field, remaining);
      };

      const handleRowClick = (e, projectId) => {
        if (['INPUT', 'BUTTON', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
        setExpandedProjectId(prev => prev === projectId ? null : projectId);
      };

      // --- SUB-STEP & NOTE CHECKLIST RENDERER ---
      const renderSubList = (project, field) => {
        const rawItems = normalizeSteps(project[field]);
        const items = hideCompletedDone ? rawItems.filter(s => !s.completed) : rawItems;

        const moveStep = (index, direction) => {
          const targetIdx = direction === 'up' ? index - 1 : index + 1;
          if (targetIdx < 0 || targetIdx >= rawItems.length) return;
          const updated = [...rawItems];
          const temp = updated[index];
          updated[index] = updated[targetIdx];
          updated[targetIdx] = temp;
          updateProjectField(project.id, field, updated);
        };

        const updateIndent = (index, direction) => {
          const updated = [...rawItems];
          const currentIndent = updated[index].indent || 0;
          updated[index].indent = direction === 'left' ? Math.max(0, currentIndent - 1) : Math.min(2, currentIndent + 1);
          updateProjectField(project.id, field, updated);
        };

        const handleKeyDown = (e, index, currentText) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            const updated = [...rawItems];
            updated[index].text = currentText.slice(0, MAX_NOTE_LENGTH);
            const newStep = { 
              id: `step-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`, 
              text: '', 
              completed: false, 
              indent: rawItems[index] ? rawItems[index].indent : 0 
            };
            updated.splice(index + 1, 0, newStep);
            updateProjectField(project.id, field, updated);
            
            setTimeout(() => {
              const nextInput = document.getElementById(`step-input-${project.id}-${field}-${index + 1}`);
              if (nextInput) nextInput.focus();
            }, 30);
          } else if (e.key === 'Tab') {
            e.preventDefault();
            updateIndent(index, e.shiftKey ? 'left' : 'right');
          } else if (e.key === 'Backspace' && currentText === '' && rawItems.length > 1) {
            e.preventDefault();
            const updated = rawItems.filter((_, i) => i !== index);
            updateProjectField(project.id, field, updated);
            setTimeout(() => {
              const prevInput = document.getElementById(`step-input-${project.id}-${field}-${Math.max(0, index - 1)}`);
              if (prevInput) prevInput.focus();
            }, 30);
          }
        };

        const updateStepText = (index, val) => {
          const updated = [...rawItems];
          updated[index].text = val.slice(0, MAX_NOTE_LENGTH);
          updateProjectField(project.id, field, updated);
        };

        const toggleStepComplete = (index) => {
          const updated = [...rawItems];
          updated[index].completed = !updated[index].completed;
          updateProjectField(project.id, field, updated);
        };

        const addEmptyStep = () => {
          updateProjectField(project.id, field, [...rawItems, { id: `step-${Date.now()}`, text: '', completed: false, indent: 0 }]);
        };

        const indentStyles = [
          'ml-0', 
          'ml-4 border-l-2 border-slate-300 dark:border-slate-700 pl-2', 
          'ml-8 border-l-2 border-amber-400 pl-2'
        ];

        const completedCountInField = rawItems.filter(s => s.completed).length;

        return (
          <div className="space-y-1.5">
            {items.map((step, idx) => (
              <div key={step.id || idx} className={`group/step flex flex-col transition-all ${indentStyles[step.indent || 0]}`}>
                <div className="flex items-start gap-2">
                  <div className="hidden md:flex flex-col text-[10px] text-slate-400 opacity-20 group-hover/step:opacity-100 transition pt-1">
                    <button onClick={() => moveStep(idx, 'up')} disabled={idx === 0} className="hover:text-amber-600 leading-none disabled:opacity-10">▲</button>
                    <button onClick={() => moveStep(idx, 'down')} disabled={idx === rawItems.length - 1} className="hover:text-amber-600 leading-none disabled:opacity-10">▼</button>
