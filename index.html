  <style>
    textarea:focus, input:focus, select:focus, [contenteditable]:focus {
      outline: none !important;
      box-shadow: none !important;
    }
    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {

    }

      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    [contenteditable]:empty:before {
      content: attr(data-placeholder);
      color: #94a3b8;
      opacity: 0.6;
      cursor: text;
    }

<body class="bg-slate-900 text-slate-100 antialiased font-sans">

  <script type="text/babel" data-type="module">
    const { useState, useEffect, useRef, useLayoutEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyCiQU2ilhdlJkxD7-kWHl6lkO2LKQYnC7E",
      authDomain: "master-tracker-7b104.firebaseapp.com",

    const CATEGORIES = ['None', 'Personal', 'Career', 'Family', 'Spiritual', 'Financial', 'Learning'];

    const CATEGORY_COLORS = {
      'None': {

      'Personal': {

      },
      'Career': {

      },
      'Family': {

      },
      'Spiritual': {

      },

      },

    const PRIORITIES = [
      { level: 0, label: '' },

      { level: 2, label: '‼️' }
    ];

    const DEMO_PROJECTS = [
      {
        id: 'demo-1',
        name: 'Q3 Strategic Roadmap',
        category: 'Career',
        priority: 2,
        orderIndex: 100,
        status: 'Aligned cross-functional leads and locked budget constraints.',
        nextSteps: [
          { id: 'd1-1', text: 'Finalize core execution milestones', done: false, indent: 0 },
          { id: 'd1-2', text: 'Publish team resource matrix', done: true, indent: 0 }
        ],
        notes: [{ id: 'dn1-1', text: 'Keep delivery zero-friction.', done: false, indent: 0 }],
        archived: false
      },
      {

        name: 'Garden Drip Irrigation',
        category: 'Personal',
        priority: 1,
        orderIndex: 200,
        status: 'Perimeter and pressure ratings verified.',
        nextSteps: [{ id: 'd2-1', text: 'Source 1/2 inch manifold fittings', done: false, indent: 0 }],
        notes: [],
        archived: false
      }
    ];

    const AutoSaveInput = ({ value, onSave, className, placeholder }) => {
      const elRef = useRef(null);
      const committedValue = useRef(value || '');

      useEffect(() => {
        if (elRef.current && document.activeElement !== elRef.current) {
          elRef.current.innerText = value || '';
          committedValue.current = value || '';
        }
      }, [value]);

      const handleBlur = () => {
        if (elRef.current) {
          const currentVal = elRef.current.innerText.trim();
          if (currentVal !== committedValue.current) {
            onSave(currentVal);
            committedValue.current = currentVal;
          }
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          elRef.current.blur();
        }
      };

      const handlePaste = (e) => {
        e.preventDefault();
        const plainText = (e.clipboardData || window.clipboardData).getData('text/plain');
        document.execCommand('insertText', false, plainText);
      };

      return (
        <div 
          ref={elRef}
          contentEditable
          suppressContentEditableWarning
          onBlur={handleBlur}
          onKeyDown={handleKeyDown}
          onPaste={handlePaste}
          className={`${className} cursor-text break-words whitespace-normal outline-none focus:outline-none min-h-[1.5em] w-full`}
          data-placeholder={placeholder}
          style={{ wordBreak: 'break-word', display: 'inline-block' }}
        />
      );
    };

    const AutoResizeTextarea = ({ value, onSave, onKeyDown, autoFocus, className, placeholder }) => {
      const textareaRef = useRef(null);
      const [val, setVal] = useState(value || '');
      const isFocused = useRef(false);

      useEffect(() => {
        if (!isFocused.current) {
          setVal(value || '');
        }
      }, [value]);
      
      useLayoutEffect(() => {
        const el = textareaRef.current;
        if (el) {
          el.style.height = 'auto';
          el.style.height = `${el.scrollHeight + 4}px`;
        }
      }, [val]);

      useEffect(() => {
        if (autoFocus && textareaRef.current) {
          textareaRef.current.focus();
          const len = textareaRef.current.value.length;
          textareaRef.current.setSelectionRange(len, len);
        }
      }, [autoFocus]);

      const handlePaste = (e) => {
        e.preventDefault();
        const plainText = (e.clipboardData || window.clipboardData).getData('text/plain');
        const target = e.target;
        const start = target.selectionStart;
        const end = target.selectionEnd;
        const currentVal = target.value;
        const newVal = currentVal.substring(0, start) + plainText + currentVal.substring(end);
        setVal(newVal);
      };

      return (
        <textarea 
          ref={textareaRef} 
          value={val} 
          placeholder={placeholder}
          onChange={(e) => setVal(e.target.value)}
          onPaste={handlePaste}
          onFocus={() => { isFocused.current = true; }}
          onBlur={() => { 
            isFocused.current = false; 
            if (val !== value) onSave(val); 
          }} 
          onKeyDown={(e) => { if (onKeyDown) onKeyDown(e, val); }}
          className={`${className} resize-none overflow-hidden bg-transparent border-none focus:ring-0 p-0 break-words whitespace-normal`} 
          rows={1} 
        />
      );
    };

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError() { return { hasError: true }; }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-8 text-center">
              <h2 className="text-lg font-bold text-red-500">A presentation error occurred in the workspace.</h2>
              <button onClick={() => window.location.reload()} className="mt-4 px-4 py-2 bg-amber-500 text-white rounded font-bold">Reload Workspace</button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [isDemoMode, setIsDemoMode] = useState(false);
      const [projects, setProjects] = useState([]);
      const [focusId, setFocusId] = useState(null);
      const [showArchived, setShowArchived] = useState(false);
      
      const [isDarkMode, setIsDarkMode] = useState(() => {
        return localStorage.getItem('theme') === 'dark' || true;
      });

      const [priorityFilter, setPriorityFilter] = useState('all');
      const [sortBy, setSortBy] = useState('manual');

      // Check URL search params for direct demo launch
      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('demo') === 'true') {
          setIsDemoMode(true);
          setProjects(DEMO_PROJECTS);
        }
      }, []);

      useEffect(() => {
        localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
      }, [isDarkMode]);

      useEffect(() => {
        return auth.onAuthStateChanged((u) => {
          setUser(u);
          if (u) setIsDemoMode(false);
          setLoading(false);
        });
      }, []);

      useEffect(() => {
        if (!user || isDemoMode) return;
        
        return db.collection('users').doc(user.uid).collection('projects')
          .onSnapshot(snapshot => {
            let data = snapshot.docs.map(doc => {
              const raw = doc.data();
              return {
                id: doc.id,
                name: typeof raw.name === 'string' ? raw.name : '',
                category: typeof raw.category === 'string' ? raw.category : 'None',
                priority: typeof raw.priority === 'number' ? raw.priority : 0,
                orderIndex: typeof raw.orderIndex === 'number' ? raw.orderIndex : 0,
                status: typeof raw.status === 'string' ? raw.status : '',
                nextSteps: Array.isArray(raw.nextSteps) ? raw.nextSteps : [],
                notes: Array.isArray(raw.notes) ? raw.notes : [],
                archived: !!raw.archived
              };
            });

            const needsIndexing = data.some(p => p.orderIndex === 0);
            if (needsIndexing && data.length > 0) {
              const batch = db.batch();
              data.forEach((p, idx) => {
                const docRef = db.collection('users').doc(user.uid).collection('projects').doc(p.id);
                batch.update(docRef, { orderIndex: (idx + 1) * 100 });
                p.orderIndex = (idx + 1) * 100;
              });
              batch.commit().catch(err => console.error("Self-healing index failed:", err.message));
            }

            setProjects(data);
          }, err => {
            console.error("Database access error:", err.message);
          });
      }, [user, isDemoMode]);

      const startDemoMode = () => {
        setIsDemoMode(true);
        setProjects(DEMO_PROJECTS);
      };

      const launchDemoInNewTab = () => {
        const demoUrl = window.location.origin + window.location.pathname + '?demo=true';
        const openedWindow = window.open(demoUrl, '_blank');
        // Fallback if popup blocker intercepted new window
        if (!openedWindow || openedWindow.closed || typeof openedWindow.closed === 'undefined') {
          startDemoMode();
        }
      };

      const exitDemoMode = () => {
        setIsDemoMode(false);
        if (window.location.search.includes('demo=true')) {
          window.history.pushState({}, document.title, window.location.pathname);
        }
      };

      const getProjectDoc = (id) => {
        if (!user) throw new Error("Unauthenticated user session.");
        return db.collection('users').doc(user.uid).collection('projects').doc(String(id));
      };

      const updateProjectField = (id, field, val) => {
        if (isDemoMode) {
          setProjects(prev => prev.map(p => p.id === id ? { ...p, [field]: val } : p));
          return;
        }
        if (!user) return;
        getProjectDoc(id).set({ [field]: val }, { merge: true })
          .catch(err => console.error("Update field failed:", err.message));
      };

      const createProject = () => {
        const maxOrder = projects.length > 0 ? Math.max(...projects.map(p => p.orderIndex || 0)) : 0;
        const newProj = {
          name: '',
          category: 'None',
          priority: 0,
          orderIndex: maxOrder + 100,
          status: '',
          nextSteps: [],
          notes: [],
          archived: false
        };

        if (isDemoMode) {
          setProjects(prev => [...prev, { ...newProj, id: `demo-${Date.now()}` }]);
          return;
        }

        if (!user) return;
        db.collection('users').doc(user.uid).collection('projects').add(newProj)
          .catch(err => console.error("Create project failed:", err.message));
      };

      const deleteProject = (id) => {
        if (!confirm("Are you sure you want to permanently delete this project?")) return;
        if (isDemoMode) {
          setProjects(prev => prev.filter(p => p.id !== id));
          return;
        }
        if (!user) return;
        getProjectDoc(id).delete().catch(err => console.error("Deletion failed:", err.message));
      };

      const moveProject = (currentIndex, direction) => {
        const targetIndex = currentIndex + direction;
        if (targetIndex < 0 || targetIndex >= sortedMasterList.length) return;

        const currentProject = sortedMasterList[currentIndex];
        const targetProject = sortedMasterList[targetIndex];
        const tempIndex = currentProject.orderIndex;

        if (isDemoMode) {
          setProjects(prev => prev.map(p => {
            if (p.id === currentProject.id) return { ...p, orderIndex: targetProject.orderIndex };
            if (p.id === targetProject.id) return { ...p, orderIndex: tempIndex };
            return p;
          }));
          return;
        }

        if (!user) return;
        const batch = db.batch();
        batch.update(getProjectDoc(currentProject.id), { orderIndex: targetProject.orderIndex });
        batch.update(getProjectDoc(targetProject.id), { orderIndex: tempIndex });
        batch.commit().catch(err => console.error("Reorder failed:", err.message));
      };

      const handleListKeyDown = (e, project, field, item, idx, currentText) => {
        const list = [...(project[field] || [])];
        const indentLevel = item.indent || 0;
        
        if (e.key === 'Enter') {
          e.preventDefault();
          list[idx] = { ...list[idx], text: currentText };
          const newId = `item-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`;
          list.splice(idx + 1, 0, { id: newId, text: '', done: false, indent: indentLevel });
          setFocusId(newId);
          updateProjectField(project.id, field, list);
        } else if (e.key === 'Tab') {
          e.preventDefault();
          const change = e.shiftKey ? -1 : 1;
          const nextIndent = Math.max(0, indentLevel + change);
          list[idx] = { ...list[idx], text: currentText, indent: nextIndent };
          updateProjectField(project.id, field, list);
        } else if (e.key === 'Backspace' && currentText === '') {
          e.preventDefault();
          list.splice(idx, 1);
          if (idx > 0) {
            setFocusId(project[field][idx - 1].id || null);
          } else {
            setFocusId(null);
          }
          updateProjectField(project.id, field, list);
        }
      };

      const renderList = (project, field, colors) => {
        const list = project[field] || [];
        return (
          <div className="flex flex-col gap-1.5 text-sm break-words">
            {list.map((item, idx) => {
              if (!item.id) item.id = `fallback-${idx}`;
              const indentLevel = item.indent || 0;
              return (
                <div 
                  key={item.id} 
                  className={`flex items-start gap-2 group transition-all duration-150 break-words border-b pb-1.5 last:border-0 ${isDarkMode ? 'border-slate-800/80' : 'border-slate-200/50'}`} 
                  style={{ marginLeft: `${indentLevel * 16}px` }}
                >
                  <input 
                    type="checkbox" 
                    checked={item.done || false} 
                    onChange={(e) => {
                      const newList = [...list];
                      newList[idx] = { ...newList[idx], done: e.target.checked };
                      updateProjectField(project.id, field, newList);
                    }} 
                    className="mt-1 h-4 w-4 rounded border-slate-400 text-amber-500 focus:ring-amber-500 cursor-pointer flex-shrink-0"
                  />
                  <AutoResizeTextarea
                    value={item.text || ''}
                    placeholder="..."
                    autoFocus={focusId === item.id}
                    onSave={(v) => {
                      const newList = [...list];
                      newList[idx] = { ...newList[idx], text: v };
                      updateProjectField(project.id, field, newList);
                    }}
                    onKeyDown={(e, textVal) => handleListKeyDown(e, project, field, item, idx, textVal)}
                    className={`flex-1 bg-transparent border-none focus:ring-0 text-sm py-0 px-1 leading-relaxed outline-none break-words ${colors.text} ${item.done ? 'line-through opacity-40' : ''}`}
                  />
                </div>
              );
            })}
            <button 
              onClick={() => {
                const newId = `item-${Date.now()}`;
                const newList = [...list, { id: newId, text: '', done: false, indent: 0 }];
                setFocusId(newId);
                updateProjectField(project.id, field, newList);
              }} 
              className="text-xs text-amber-500 hover:text-amber-400 transition flex items-center gap-1 mt-1 pl-1 font-semibold"
            >
              + Add item
            </button>
          </div>
        );
      };

      if (loading) return <div className="h-screen flex items-center justify-center text-slate-400 font-medium">Connecting Workspace...</div>;

      if (!user && !isDemoMode) {
        return (
          <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col lg:flex-row font-sans">
            {/* Main Hero Content Area */}
            <div className="flex-1 p-8 sm:p-12 lg:p-16 flex flex-col justify-between items-start max-w-7xl mx-auto w-full">
              
              <div className="w-full">
                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-sky-500/10 text-sky-400 border border-sky-500/20 text-xs font-semibold mb-6">
                  <span className="w-2 h-2 rounded-full bg-sky-400 animate-pulse"></span>
                  Focus-First System
                </div>
                
                <h1 className="text-3xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight leading-tight mb-4 text-white max-w-3xl">
                  Zero-Friction Project Tracking
                </h1>
                
                <p className="text-slate-300 text-base sm:text-lg max-w-2xl leading-relaxed mb-10">
                  Built on a <strong>pure simplistic</strong> workflow. Easily <strong>track active projects</strong>, instantly review <strong>what you have done and what's next</strong>, and <strong>avoid cognitive overwhelm</strong> without software clutter.
                </p>

                {/* Benefits Matrix - Enhanced Font Sizes */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-10 w-full max-w-5xl">
                  <div className="bg-slate-800/80 border border-slate-700 p-5 rounded-xl">
                    <div className="text-2xl mb-2">✨</div>
                    <div className="font-bold text-base sm:text-lg text-slate-100 mb-2">Pure Simplistic</div>
                    <div className="text-sm text-slate-300 leading-relaxed">Zero configuration or admin bloat. Focus purely on execution.</div>
                  </div>

                  <div className="bg-slate-800/80 border border-slate-700 p-5 rounded-xl">
                    <div className="text-2xl mb-2">🎯</div>
                    <div className="font-bold text-base sm:text-lg text-slate-100 mb-2">Track Active Projects</div>
                    <div className="text-sm text-slate-300 leading-relaxed">A single high-density view for all active streams.</div>
                  </div>

                  <div className="bg-slate-800/80 border border-slate-700 p-5 rounded-xl">
                    <div className="text-2xl mb-2">📋</div>
                    <div className="font-bold text-base sm:text-lg text-slate-100 mb-2">Done & What's Next</div>
                    <div className="text-sm text-slate-300 leading-relaxed">Immediate clarity on completed milestones and next steps.</div>
                  </div>

                  <div className="bg-slate-800/80 border border-slate-700 p-5 rounded-xl">
                    <div className="text-2xl mb-2">🔒</div>
                    <div className="font-bold text-base sm:text-lg text-slate-100 mb-2">Keep It Private</div>
                    <div className="text-sm text-slate-300 leading-relaxed">Avoid cognitive overwhelm in an isolated secure workspace.</div>
                  </div>
                </div>

                {/* UI Mockup - Reflecting Actual Board Layout */}
                <div className="w-full max-w-4xl bg-slate-800/90 border border-slate-700 rounded-xl p-5 shadow-2xl">
                  <div className="flex items-center justify-between pb-3 border-b border-slate-700 mb-4">
                    <div className="flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
                      <span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                      <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                      <span className="text-xs font-mono text-slate-400 ml-2">Real Board Preview</span>
                    </div>
                    <span className="text-xs text-amber-400 font-mono">Live Table View</span>
                  </div>
                  
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs border-collapse">
                      <thead>
                        <tr className="bg-amber-400 text-slate-950 font-black uppercase tracking-wider text-[11px]">
                          <th className="p-2.5 rounded-l">PROJECT</th>
                          <th className="p-2.5">PRIORITY</th>
                          <th className="p-2.5">CATEGORY</th>
                          <th className="p-2.5">WHAT'S DONE</th>
                          <th className="p-2.5 rounded-r">PICK UP FROM</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-700/60 text-slate-300">
                        <tr>
                          <td className="p-3 font-bold text-slate-100">Q3 Strategic Roadmap</td>
                          <td className="p-3">‼️</td>
                          <td className="p-3"><span className="px-2 py-0.5 rounded bg-orange-500/20 text-orange-300 border border-orange-500/30">Career</span></td>
                          <td className="p-3 text-slate-400">Aligned cross-functional leads and locked budget constraints.</td>
                          <td className="p-3 font-medium text-emerald-400">• Finalize core execution milestones</td>
                        </tr>
                        <tr>
                          <td className="p-3 font-bold text-slate-100">Garden Drip Irrigation</td>
                          <td className="p-3">❗</td>
                          <td className="p-3"><span className="px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 border border-blue-500/30">Personal</span></td>
                          <td className="p-3 text-slate-400">Perimeter and pressure ratings verified.</td>
                          <td className="p-3 font-medium text-emerald-400">• Source 1/2 inch manifold fittings</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>

              <div className="mt-8 text-xs text-slate-500 font-mono">
                Pure Simplistic Architecture • Zero Overwhelm
              </div>
            </div>

            {/* Right Side Login Panel */}
            <div className="w-full lg:w-[440px] bg-slate-800/70 border-t lg:border-t-0 lg:border-l border-slate-700/60 p-8 sm:p-12 flex items-center justify-center">
              <div className="w-full max-w-sm text-center">
                
                <div className="inline-block px-3 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-full text-xs font-extrabold uppercase tracking-wide mb-3">
                  100% Free Forever
                </div>

                <h2 className="text-2xl sm:text-3xl font-extrabold text-white mb-2 tracking-tight">
                  Create your own, for free!
                </h2>
                
                <p className="text-slate-300 text-xs sm:text-sm leading-relaxed mb-8">
                  Get instant access to your clean workspace. Track active projects, organize what you have done and what's next, avoid cognitive overwhelm, and keep it private.
                </p>

                <button 
                  onClick={() => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}
                  className="w-full py-3.5 px-4 bg-white hover:bg-slate-100 text-slate-900 font-bold rounded-lg shadow-lg transition duration-150 flex items-center justify-center gap-3 text-sm"
                >
                  <svg className="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                  </svg>
                  Continue with Google
                </button>

                <div className="relative my-6">
                  <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-slate-700"></div></div>
                  <div className="relative flex justify-center text-xs uppercase"><span className="bg-slate-800 px-2 text-slate-500 font-semibold">OR</span></div>
                </div>

                <button 
                  onClick={launchDemoInNewTab}
                  className="w-full py-3 px-4 bg-transparent hover:bg-slate-700/50 text-sky-400 font-bold rounded-lg border border-sky-500/40 transition duration-150 text-sm"
                >
                  View Live Demo (New Tab ↗)
                </button>

                <div className="mt-8 text-xs text-slate-400 bg-slate-900/60 p-3 rounded-lg border border-slate-700/50">
                  🔒 <strong>Keep It Private:</strong> Direct user-isolated database auth. Zero tracking, zero ads.
                </div>
              </div>
            </div>
          </div>
        );
      }

      const sortedMasterList = [...projects]
        .filter(p => p.archived === showArchived)
        .sort((a, b) => {
          if (sortBy === 'priority-desc') return b.priority - a.priority;
          if (sortBy === 'priority-asc') return a.priority - b.priority;
          return a.orderIndex - b.orderIndex;
        });

      const displayedProjects = sortedMasterList.filter(p => {
        if (priorityFilter !== 'all') {
          return p.priority === parseInt(priorityFilter, 10);
        }
        return true;
      });

      const isManualOrderingActive = sortBy === 'manual' && priorityFilter === 'all';

      return (
        <ErrorBoundary>
          {isDemoMode && (
            <div className="bg-sky-600 text-white text-xs font-semibold px-4 py-2 flex flex-col sm:flex-row items-center justify-between gap-2 shadow">
              <span>⚡ You are viewing an interactive Live Demo sandbox.</span>
              <div className="flex items-center gap-2">
                <button 
                  onClick={exitDemoMode}
                  className="bg-sky-800 text-white px-3 py-1 rounded font-bold hover:bg-sky-900 transition"
                >
                  ← Exit Demo / Go Home
                </button>
                <button 
                  onClick={() => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}
                  className="bg-white text-sky-950 px-3 py-1 rounded font-bold hover:bg-sky-50 transition"
                >
                  Sign In with Google
                </button>
              </div>
            </div>
          )}

          <div className={`p-4 md:p-6 min-h-screen transition-colors duration-200 ${isDarkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-50 text-slate-900'}`}>
            <div className="max-w-[1400px] mx-auto mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div className="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4">
                <h1 className="text-2xl font-extrabold tracking-tight">My Workspace</h1>
                <div className={`text-xs px-2.5 py-1 rounded-full font-mono self-start sm:self-auto truncate max-w-[280px] ${isDarkMode ? 'bg-slate-800 text-slate-300' : 'bg-slate-200 text-slate-700'}`}>
                  {isDemoMode ? 'demo@sandbox.local' : user?.email}
                </div>
              </div>

              <div className="flex flex-wrap gap-2 items-center">
                {/* Dark Mode Toggle */}
                <button 
                  onClick={() => setIsDarkMode(!isDarkMode)} 
                  className={`px-3 py-1.5 text-xs rounded-lg font-bold border transition ${isDarkMode ? 'bg-slate-800 border-slate-700 text-amber-400 hover:bg-slate-700' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-100'}`}
                  title="Toggle Light / Dark Mode"
                >
                  {isDarkMode ? '☀️ Light' : '🌙 Dark'}
                </button>

                <div className={`flex items-center border rounded-lg px-2.5 py-1.5 text-xs font-semibold ${isDarkMode ? 'bg-slate-900 border-slate-800 text-slate-200' : 'bg-white border-slate-200 text-slate-700'}`}>
                  <span className="mr-2 text-slate-400">Filter:</span>
                  <select 
                    value={priorityFilter} 
                    onChange={(e) => setPriorityFilter(e.target.value)} 
                    className="bg-transparent border-none p-0 pr-6 text-xs font-bold cursor-pointer outline-none"
                  >
                    <option value="all" className={isDarkMode ? 'bg-slate-900 text-white' : ''}>All Priorities</option>
                    <option value="2" className={isDarkMode ? 'bg-slate-900 text-white' : ''}>‼️ Escalation</option>
                    <option value="1" className={isDarkMode ? 'bg-slate-900 text-white' : ''}>❗ Priority</option>
                    <option value="0" className={isDarkMode ? 'bg-slate-900 text-white' : ''}>Normal</option>
                  </select>
                </div>

                <div className={`flex items-center border rounded-lg px-2.5 py-1.5 text-xs font-semibold ${isDarkMode ? 'bg-slate-900 border-slate-800 text-slate-200' : 'bg-white border-slate-200 text-slate-700'}`}>
                  <span className="mr-2 text-slate-400">Sort:</span>
                  <select 
                    value={sortBy} 
                    onChange={(e) => setSortBy(e.target.value)} 
                    className="bg-transparent border-none p-0 pr-6 text-xs font-bold cursor-pointer outline-none"
                  >
                    <option value="manual" className={isDarkMode ? 'bg-slate-900 text-white' : ''}>Manual Order</option>
                    <option value="priority-desc" className={isDarkMode ? 'bg-slate-900 text-white' : ''}>Priority: High to Low</option>
                    <option value="priority-asc" className={isDarkMode ? 'bg-slate-900 text-white' : ''}>Priority: Low to High</option>
                  </select>
                </div>

                <button 
                  onClick={() => setShowArchived(!showArchived)} 
                  className={`px-4 py-2 text-xs rounded-lg font-bold border transition duration-150 ${!showArchived ? (isDarkMode ? 'bg-slate-900 border-slate-800 text-slate-200 hover:bg-slate-800' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50') : 'bg-amber-500 border-amber-600 text-slate-950 font-black hover:bg-amber-600'}`}
                >
                  {showArchived ? "View Active Projects" : "View Archived Projects"}
                </button>

                {isDemoMode ? (
                  <button 
                    onClick={exitDemoMode} 
                    className={`px-4 py-2 text-xs border rounded-lg font-semibold transition duration-150 ${isDarkMode ? 'bg-slate-900 border-slate-800 text-slate-300 hover:bg-slate-800' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'}`}
                  >
                    Exit Demo
                  </button>
                ) : (
                  <button 
                    onClick={() => auth.signOut()} 
                    className={`px-4 py-2 text-xs border rounded-lg font-semibold transition duration-150 ${isDarkMode ? 'bg-slate-900 border-slate-800 text-slate-400 hover:text-red-400 hover:border-red-900' : 'bg-white border-slate-200 text-slate-500 hover:text-red-600 hover:border-red-200'}`}
                  >
                    Sign Out
                  </button>
                )}
              </div>
            </div>

            <div className={`max-w-[1400px] mx-auto rounded-xl border shadow-sm overflow-hidden ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
              <div className="overflow-x-auto w-full custom-scrollbar">
                <table className="w-full text-left border-collapse min-w-[1250px] table-fixed">
                  <thead className={isDarkMode ? 'bg-amber-500 text-slate-950 text-sm uppercase tracking-wider font-extrabold' : 'bg-amber-400 text-amber-955 text-sm uppercase tracking-wider font-extrabold'}>
                    <tr>
                      <th className="p-5 w-[16%]">Project</th>
                      <th className="p-5 w-[7%]">Priority</th>
                      <th className="p-5 w-[10%]">Category</th>
                      <th className="p-5 w-[18%]">What's Done</th>
                      <th className="p-5 w-[22%]">Pick Up From</th>
                      <th className="p-5 w-[22%]">Notes</th>
                      <th className="p-5 w-[5%] text-center">Order</th>
                    </tr>
                  </thead>
                  <tbody className={`divide-y ${isDarkMode ? 'divide-slate-800' : 'divide-slate-200'}`}>
                    {displayedProjects.map((p, index) => {
                      const colorScheme = CATEGORY_COLORS[p.category] || CATEGORY_COLORS['None'];
                      const colors = isDarkMode ? colorScheme.dark : colorScheme.light;
                      return (
                        <tr key={p.id} className={`${colors.bg} border-b ${isDarkMode ? 'border-slate-800 hover:bg-slate-800/60' : 'border-slate-200 hover:bg-slate-50/60'} transition group/row`}>
                          <td className={`p-5 align-top border-l-4 ${colors.border} break-words`}>
                            <div className="flex flex-col gap-1 break-words">
                              <AutoSaveInput 
                                value={p.name} 
                                placeholder="Project Name..."
                                onSave={(v) => updateProjectField(p.id, 'name', v)} 
                                className={`w-full font-bold text-base bg-transparent border-none outline-none focus:ring-0 ${colors.text} break-words whitespace-normal`} 
                              />
                              <div className="flex items-center gap-2 opacity-0 group-hover/row:opacity-100 transition duration-150 text-xs mt-2">
                                <button 
                                  onClick={() => updateProjectField(p.id, 'archived', !p.archived)} 
                                  className="text-slate-400 hover:text-amber-500 font-medium transition"
                                >
                                  {p.archived ? "Unarchive" : "Archive"}
                                </button>
                                <span className="text-slate-600">|</span>
                                <button 
                                  onClick={() => deleteProject(p.id)} 
                                  className="text-slate-400 hover:text-red-500 font-medium transition"
                                >
                                  Delete
                                </button>
                              </div>
                            </div>
                          </td>

                          <td className="p-5 align-top">
                            <select 
                              value={p.priority} 
                              onChange={(e) => updateProjectField(p.id, 'priority', parseInt(e.target.value, 10))} 
                              className={`p-1 rounded text-sm border outline-none font-bold text-center cursor-pointer w-full max-w-[100px] ${colors.text} ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}
                            >
                              {PRIORITIES.map(opt => (
                                <option key={opt.level} value={opt.level} className={isDarkMode ? 'bg-slate-900 text-white' : ''}>
                                  {opt.label}
                                </option>
                              ))}
                            </select>
                          </td>

                          <td className="p-5 align-top">
                            <select 
                              value={p.category || 'None'} 
                              onChange={(e) => updateProjectField(p.id, 'category', e.target.value)} 
                              className={`p-1 rounded text-sm border outline-none font-semibold ${colors.text} cursor-pointer w-full max-w-[130px] ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}
                            >
                              {CATEGORIES.map(c => <option key={c} value={c} className={isDarkMode ? 'bg-slate-900 text-white' : ''}>{c}</option>)}
                            </select>
                          </td>

                          {/* "What's Done" Column */}
                          <td className="p-5 align-top break-words">
                            <AutoResizeTextarea 
                              value={p.status || ''} 
                              placeholder="..."
                              onSave={(v) => updateProjectField(p.id, 'status', v)} 
                              className={`w-full text-sm leading-relaxed p-1 ${colors.text} break-words whitespace-normal`}
                            />
                          </td>

                          {/* "Pick Up From" Column */}
                          <td className="p-5 align-top break-words">
                            {renderList(p, 'nextSteps', colors)}
                          </td>

                          {/* "Notes" Column */}
                          <td className="p-5 align-top break-words">
                            {renderList(p, 'notes', colors)}
                          </td>

                          <td className="p-4 align-top text-center">
                            {isManualOrderingActive ? (
                              <div className="flex items-center justify-center gap-1.5 mt-1">
                                <button 
                                  onClick={() => moveProject(index, -1)}
                                  disabled={index === 0}
                                  className="p-1 text-slate-400 hover:text-amber-500 disabled:opacity-20 transition"
                                  title="Move Up"
                                >
                                  ▲
                                </button>
                                <button 
                                  onClick={() => moveProject(index, 1)}
                                  disabled={index === displayedProjects.length - 1}
                                  className="p-1 text-slate-400 hover:text-amber-500 disabled:opacity-20 transition"
                                  title="Move Down"
                                >
                                  ▼
                                </button>
                              </div>
                            ) : (
                              <div className="text-xs text-slate-500 font-medium italic mt-2" title="Manual reordering is disabled while active sort or filters are applied.">
                                Sorted
                              </div>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                    {displayedProjects.length === 0 && (
                      <tr>
                        <td colSpan="7" className="p-16 text-center text-slate-400">
                          <p className="mb-4 text-sm font-medium">
                            {showArchived ? "No archived projects match your filters." : "No projects match your current filter settings."}
                          </p>
                          {!showArchived && priorityFilter === 'all' && (
                            <button 
                              onClick={createProject} 
                              className="px-6 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded shadow transition"
                            >
                              Create Your First Project
                            </button>
                          )}
                        </td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>

              {displayedProjects.length > 0 && !showArchived && (
                <div className={`p-5 border-t ${isDarkMode ? 'border-slate-800 bg-slate-900/50' : 'border-slate-100 bg-slate-50/50'}`}>
                  <button 
                    onClick={createProject} 
                    className="px-5 py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 rounded-lg font-bold shadow hover:shadow-md transition"
                  >
                    + New Project
                  </button>
                </div>
              )}
            </div>
          </div>
        </ErrorBoundary>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
