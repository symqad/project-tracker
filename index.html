<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Project Tracker</title>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyCiQU2ilhdlJkxD7-kWHl6lkO2LKQYnC7E",
      authDomain: "master-tracker-7b104.firebaseapp.com",
      projectId: "master-tracker-7b104",
      storageBucket: "master-tracker-7b104.firebasestorage.app",
      messagingSenderId: "706171177063",
      appId: "1:706171177063:web:ac2415157560969c5a6cc2"
    };
    
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const appId = "default-app-id";

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [projects, setProjects] = useState([]);

      useEffect(() => {
        return auth.onAuthStateChanged((u) => {
          setUser(u);
          setLoading(false);
        });
      }, []);

      useEffect(() => {
        if (!user) return;
        const path = `artifacts/${appId}/users/${user.uid}/projects`;
        console.log("DEBUG PATH:", path); // Check this in your Console (F12)
        
        return db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('projects')
          .onSnapshot(snapshot => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            console.log("DEBUG DATA FETCHED:", data); 
            setProjects(data);
          });
      }, [user]);

      if (loading) return <div className="h-screen flex items-center justify-center">Authenticating...</div>;
      if (!user) return (
        <div className="h-screen flex flex-col items-center justify-center gap-4 bg-slate-100">
          <h1 className="text-2xl font-bold">Project Tracker</h1>
          <button onClick={() => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())} 
            className="px-6 py-3 bg-white border border-slate-300 rounded-lg shadow-sm hover:bg-slate-50 transition">
            Sign in with Google
          </button>
        </div>
      );

      return (
        <div className="p-6 bg-slate-50 min-h-screen">
          <div className="max-w-[1200px] mx-auto bg-white rounded-lg border shadow-sm overflow-hidden">
            <table className="w-full text-left border-collapse">
              <thead className="bg-amber-400 text-amber-950 text-sm uppercase tracking-wider font-bold">
                <tr><th className="p-5">Project</th><th className="p-5">Category</th><th className="p-5">Status</th><th className="p-5">Next Steps</th><th className="p-5">Notes</th></tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {projects.map(p => (
                  <tr key={p.id} className="bg-slate-100/50">
                    <td className="p-5 font-bold">{p.name}</td>
                    <td className="p-5">{p.category}</td>
                    <td className="p-5">{p.status}</td>
                    <td className="p-5">View/Edit Items</td>
                    <td className="p-5">View/Edit Notes</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
