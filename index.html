<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Project Tracker</title>
  <!-- React and dependencies -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    // This script contains the full React application logic
    const { useState, useEffect, useRef, useLayoutEffect } = React;

    const CATEGORY_COLORS = {
      'Personal': { border: 'border-l-blue-500', bg: 'bg-blue-100 bg-opacity-5', text: 'text-blue-800' },
      'Career': { border: 'border-l-amber-500', bg: 'bg-amber-100 bg-opacity-5', text: 'text-amber-900' },
      'Family': { border: 'border-l-pink-500', bg: 'bg-pink-100 bg-opacity-5', text: 'text-pink-800' },
      'Spiritual': { border: 'border-l-green-500', bg: 'bg-green-100 bg-opacity-5', text: 'text-green-800' },
      'Financial': { border: 'border-l-purple-500', bg: 'bg-purple-100 bg-opacity-5', text: 'text-purple-800' },
      '': { border: 'border-l-slate-300', bg: 'bg-slate-100 bg-opacity-5', text: 'text-slate-500' }
    };

    const AutoResizeTextarea = ({ value, onSave, onKeyDown, autoFocus, className }) => {
      const textareaRef = useRef(null);
      const [localValue, setLocalValue] = useState(value);
      
      const resize = (t) => {
        if (t) {
          t.style.height = 'auto';
          t.style.height = t.scrollHeight + 'px';
        }
      };

      useLayoutEffect(() => { resize(textareaRef.current); }, [value]);
      useEffect(() => {
        setLocalValue(value);
        if (autoFocus && textareaRef.current) textareaRef.current.focus();
      }, [value, autoFocus]);
      
      return (
        <textarea ref={textareaRef} value={localValue} onChange={(e) => { setLocalValue(e.target.value); resize(e.target); }}
          onBlur={() => onSave(localValue)} onKeyDown={(e) => onKeyDown(e, localValue)}
          autoFocus={autoFocus} className={`${className} resize-none overflow-hidden`} rows={1} />
      );
    };

    function App() {
      const [projects, setProjects] = useState([{ id: '1', name: 'New Project', category: 'Career', status: '', nextSteps: [], notes: [] }]);
      const [focusId, setFocusId] = useState(null);

      const updateProjectField = (id, field, val) => {
        setProjects(prev => prev.map(p => p.id === id ? { ...p, [field]: val } : p));
      };

      const handleListKeyDown = (e, projectId, listType, item, list, currentValue) => {
        const idx = list.findIndex(i => i.id === item.id);
        list[idx].text = currentValue;
        
        if (e.key === 'Tab') {
          e.preventDefault();
          list[idx].indent = Math.max((list[idx].indent || 0) + (e.shiftKey ? -1 : 1), 0);
          updateProjectField(projectId, listType, list);
        } else if (e.key === 'Enter') {
          e.preventDefault();
          updateProjectField(projectId, listType, list); 
          const newId = Date.now();
          list.splice(idx + 1, 0, { id: newId, text: '', done: false, indent: list[idx].indent || 0 });
          updateProjectField(projectId, listType, list);
          setFocusId(newId);
        }
      };

      const renderList = (project, listType, textColor) => (
        <div className="flex flex-col gap-2">
          {project[listType]?.map(item => (
            <div key={item.id} className="flex items-start gap-2 group" style={{ marginLeft: `${(item.indent || 0) * 20}px` }}>
              <button onClick={() => {
                const list = project[listType].map(i => i.id === item.id ? {...i, done: !i.done} : i);
                updateProjectField(project.id, listType, list);
              }} className="mt-1 opacity-70 hover:opacity-100">
                {item.done ? '☑' : '☐'}
              </button>
              <AutoResizeTextarea autoFocus={focusId === item.id} value={item.text} onSave={(v) => {
                  const list = project[listType].map(i => i.id === item.id ? {...i, text: v} : i);
                  updateProjectField(project.id, listType, list);
                }} onKeyDown={(e, v) => handleListKeyDown(e, project.id, listType, item, [...(project[listType] || [])], v)} className={`flex-1 text-base bg-transparent border-none focus:ring-0 ${textColor} ${item.done ? 'line-through opacity-50' : ''}`} />
            </div>
          ))}
          <button onClick={() => {
            const newId = Date.now();
            updateProjectField(project.id, listType, [...(project[listType] || []), { id: newId, text: '', done: false, indent: 0 }]);
            setFocusId(newId);
          }} className={`text-sm font-bold mt-2 flex items-center gap-1 ${textColor} opacity-60 hover:opacity-100`}>
            + Add Item
          </button>
        </div>
      );

      return (
        <div className="p-6 bg-slate-50 min-h-screen">
          <div className="max-w-[1200px] mx-auto bg-white rounded-lg border shadow-sm overflow-hidden">
            <table className="w-full text-left border-collapse">
              <thead className="bg-amber-400 text-amber-950 text-sm uppercase tracking-wider font-bold">
                <tr><th className="p-5 w-[15%]">Project</th><th className="p-5 w-[15%]">Category</th><th className="p-5 w-[20%]">Status</th><th className="p-5 w-[25%]">Next Steps</th><th className="p-5 w-[25%]">Notes</th></tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {projects.map(p => {
                  const colors = CATEGORY_COLORS[p.category] || CATEGORY_COLORS[''];
                  return (
                    <tr key={p.id} className={`${colors.bg} ${colors.text}`}>
                      <td className={`p-5 align-top border-l-4 ${colors.border}`}>
                        <input type="text" value={p.name} onChange={(e) => updateProjectField(p.id, 'name', e.target.value)} className={`w-full font-bold text-lg bg-transparent border-none outline-none ${colors.text}`} />
                      </td>
                      <td className="p-5 align-top">
                        <select value={p.category} onChange={(e) => updateProjectField(p.id, 'category', e.target.value)} className={`p-2 rounded text-base w-full bg-white/50 border border-slate-200 ${colors.text}`}>
                          {Object.keys(CATEGORY_COLORS).map(cat => <option key={cat} value={cat}>{cat || 'None'}</option>)}
                        </select>
                      </td>
                      <td className="p-5 align-top"><AutoResizeTextarea value={p.status} onSave={(v) => updateProjectField(p.id, 'status', v)} className={`w-full text-base bg-transparent border-none ${colors.text}`} /></td>
                      <td className="p-5 align-top">{renderList(p, 'nextSteps', colors.text)}</td>
                      <td className="p-5 align-top">{renderList(p, 'notes', colors.text)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
