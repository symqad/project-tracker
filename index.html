  <script type="text/babel">
    const { useState, useEffect, useRef, useLayoutEffect, Component } = React;

    // =========================================================================

    const firebaseConfig = {

    // --- CONSTANTS & SCHEMAS ---
    const MAX_NAME_LENGTH = 150;

    const CATEGORIES = ['Work', 'Personal', 'Financial', 'Learning', 'Family', 'Spiritual', 'None'];

    const CATEGORY_COLORS = {
      Work: { border: 'border-l-orange-500', badge: 'bg-orange-50 text-orange-800 border-orange-200 dark:bg-orange-950/40 dark:text-orange-300 dark:border-orange-800', tint: 'bg-orange-50/30 dark:bg-orange-950/20' },
      Personal: { border: 'border-l-emerald-500', badge: 'bg-emerald-50 text-emerald-800 border-emerald-200 dark:bg-emerald-950/40 dark:text-emerald-300 dark:border-emerald-800', tint: 'bg-emerald-50/30 dark:bg-emerald-950/20' },
      Financial: { border: 'border-l-amber-500', badge: 'bg-amber-50 text-amber-800 border-amber-200 dark:bg-amber-950/40 dark:text-amber-300 dark:border-amber-800', tint: 'bg-amber-50/30 dark:bg-amber-950/20' },
      Learning: { border: 'border-l-pink-500', badge: 'bg-pink-50 text-pink-800 border-pink-200 dark:bg-pink-950/40 dark:text-pink-300 dark:border-pink-800', tint: 'bg-pink-50/30 dark:bg-pink-950/20' },
      Family: { border: 'border-l-fuchsia-500', badge: 'bg-fuchsia-50 text-fuchsia-800 border-fuchsia-200 dark:bg-fuchsia-950/40 dark:text-fuchsia-300 dark:border-fuchsia-800', tint: 'bg-fuchsia-50/30 dark:bg-fuchsia-950/20' },
      Spiritual: { border: 'border-l-teal-500', badge: 'bg-teal-50 text-teal-800 border-teal-200 dark:bg-teal-950/40 dark:text-teal-300 dark:border-teal-800', tint: 'bg-teal-50/30 dark:bg-teal-950/20' },
      None: { border: 'border-l-slate-400', badge: 'bg-slate-100 text-slate-600 border-slate-200 dark:bg-slate-800 dark:text-slate-400 dark:border-slate-700', tint: 'bg-slate-50/15 dark:bg-slate-900/15' }
    };

    const DEMO_PROJECTS = [
      {
        id: 'demo-1',
        name: 'Garage Cleanout & Storage Setup',
        briefStatus: 'Cleared out the left side and put up two heavy-duty shelving units.',
        category: 'Personal',
        priority: 2,
        status: 'active',
        archived: false,
        orderIndex: 100,
        nextSteps: [
          { id: 'd1-1', text: 'Pick up two 50-liter clear storage bins from the hardware store', completed: false, indent: 0 },
          { id: 'd1-2', text: 'Sort holiday decorations and seasonal gear into labeled bins', completed: false, indent: 0 },
          { id: 'd1-3', text: 'Drop off old paint cans and electronics at the local recycling depot', completed: false, indent: 0 }
        ],
        notes: [
          { id: 'dn1-1', text: 'Max bin height for the middle shelves is 18 inches.', completed: false, indent: 0 },
          { id: 'dn1-2', text: 'Hazardous waste depot is open Tues & Sat 8 am–2 pm only.', completed: false, indent: 0 }
        ]
      },
      {
        id: 'demo-2',
        name: 'Annual Tax & Document Prep',
        briefStatus: 'Gathered income slips and categorized digital receipts for the year.',
        category: 'Financial',
        priority: 1,
        status: 'active',
        archived: false,
        orderIndex: 200,
        nextSteps: [
          { id: 'd2-1', text: 'Download property tax and medical expense summaries from online accounts', completed: false, indent: 0 },
          { id: 'd2-2', text: 'Log charitable donations and deductible expenses into a summary list', completed: false, indent: 0 },
          { id: 'd2-3', text: 'Upload organized files to the accountant portal', completed: false, indent: 0 }
        ],
        notes: [
          { id: 'dn2-1', text: 'Portal has a 25 MB file size limit per upload.', completed: false, indent: 0 },
          { id: 'dn2-2', text: 'Filing deadline is April 30.', completed: false, indent: 0 }
        ]
      }
    ];

    const normalizeSteps = (items) => {
      if (!Array.isArray(items)) return [];
      return items.map((item, idx) => {
        if (!item) return { id: `step-${Date.now()}-${idx}`, text: '', completed: false, indent: 0 };
        if (typeof item === 'string') return { id: `step-${Date.now()}-${idx}`, text: item.slice(0, MAX_NOTE_LENGTH), completed: false, indent: 0 };
        return {
          id: item.id || `step-${Date.now()}-${idx}`,
          text: (item.text || '').slice(0, MAX_NOTE_LENGTH),
          completed: !!(item.completed || item.done),
          indent: typeof item.indent === 'number' ? Math.max(0, Math.min(2, item.indent)) : 0
        };
      });
    };

    // --- REFINED AUTO-EXPANDING COMPONENTS ---
    const AutoSaveInput = ({ value, onSave, placeholder, className, maxLength = MAX_NAME_LENGTH }) => {
      const [val, setVal] = useState(value || '');
      const timerRef = useRef(null);

      useEffect(() => setVal(value || ''), [value]);

      const debouncedSave = (newValue) => {
        if (timerRef.current) clearTimeout(timerRef.current);
        timerRef.current = setTimeout(() => {
          if (newValue !== value) onSave(newValue);
        }, 300);
      };

      const handleChange = (e) => {
        let text = e.target.value;
        if (maxLength && text.length > maxLength) text = text.slice(0, maxLength);
        setVal(text);
        debouncedSave(text);
      };

      const handlePaste = (e) => {
        e.preventDefault();
        const plainText = (e.clipboardData || window.clipboardData).getData('text/plain');
        let text = plainText;
        if (maxLength && text.length > maxLength) text = text.slice(0, maxLength);
        setVal(text);
        debouncedSave(text);
      };

      return (
        <input
          type="text"
          value={val}
          maxLength={maxLength}
          placeholder={placeholder}
          onChange={handleChange}
          onPaste={handlePaste}
          onBlur={() => {
            if (timerRef.current) clearTimeout(timerRef.current);
            if (val !== value) onSave(val);
          }}
          className={`bg-transparent w-full focus:outline-none focus:border-b-2 focus:border-amber-500 py-0.5 transition-colors break-words whitespace-normal ${className}`}
        />
      );
    };

    const AutoResizeTextarea = ({ value, onSave, onKeyDown, id, placeholder, className, maxLength = MAX_NOTE_LENGTH, onFocus }) => {
      const [val, setVal] = useState(value || '');
      const textareaRef = useRef(null);
      const timerRef = useRef(null);

      useEffect(() => setVal(value || ''), [value]);

      useLayoutEffect(() => {
        const updateHeight = () => {
          if (textareaRef.current) {
            textareaRef.current.style.height = 'auto';
            const newHeight = Math.max(22, textareaRef.current.scrollHeight);
            textareaRef.current.style.height = `${newHeight}px`;
          }
        };
        updateHeight();
        const raf = requestAnimationFrame(updateHeight);
        return () => cancelAnimationFrame(raf);
      }, [val]);

      const debouncedSave = (newValue) => {
        if (timerRef.current) clearTimeout(timerRef.current);
        timerRef.current = setTimeout(() => {
          if (newValue !== value) onSave(newValue);
        }, 300);
      };

      const handleChange = (e) => {
        let text = e.target.value;
        if (maxLength && text.length > maxLength) text = text.slice(0, maxLength);
        setVal(text);
        debouncedSave(text);
      };

      const handlePaste = (e) => {
        e.preventDefault();
        const plainText = (e.clipboardData || window.clipboardData).getData('text/plain');
        let text = plainText;
        if (maxLength && text.length > maxLength) text = text.slice(0, maxLength);
        setVal(text);
        debouncedSave(text);
      };

      return (
        <div className="relative w-full">
          <textarea
            id={id}
            ref={textareaRef}
            rows={1}
            value={val}
            maxLength={maxLength}
            placeholder={placeholder}
            onFocus={onFocus}
            onChange={handleChange}
            onKeyDown={(e) => { if (onKeyDown) onKeyDown(e, val); }}
            onPaste={handlePaste}
            onBlur={() => {
              if (timerRef.current) clearTimeout(timerRef.current);
              if (val !== value) onSave(val);
            }}
            className={`bg-transparent w-full focus:outline-none focus:border-b-2 focus:border-amber-500 py-0.5 leading-snug border-none resize-none overflow-hidden break-words whitespace-pre-wrap ${className}`}
          />
        </div>
      );
    };

    const PriorityCell = ({ priority, onChange }) => {
      const cyclePriority = () => {
        onChange((priority + 1) % 3);
      };

      const renderSymbol = () => {
        if (priority === 2) return <span className="text-lg font-black text-rose-600 dark:text-rose-400 font-mono tracking-tighter whitespace-nowrap">{"!\u00A0!"}</span>;
        if (priority === 1) return <span className="text-lg font-black text-amber-500 dark:text-amber-400 font-mono tracking-tighter whitespace-nowrap">!</span>;
        return <span className="text-xs text-slate-400 opacity-60 font-mono">—</span>;
      };

      return (
        <button 
          onClick={cyclePriority}
          title="Click to cycle priority"
          className="w-full flex items-center justify-center h-8 bg-slate-100/80 dark:bg-slate-800/60 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200/60 dark:border-slate-700/60 rounded-md transition shadow-sm cursor-pointer focus:outline-none"
        >
          {renderSymbol()}
        </button>
      );
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [isDarkMode, setIsDarkMode] = useState(() => {
        const stored = localStorage.getItem('tracker_theme');
        if (stored) return stored === 'dark';
        return window.innerWidth < 1024;
      });
      
      const [currentView, setCurrentView] = useState('active');
      const [projects, setProjects] = useState([]);
      const [loading, setLoading] = useState(true);
      const [user, setUser] = useState(null);
      
      const [isDemoMode, setIsDemoMode] = useState(false);
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [deferredInstallPrompt, setDeferredInstallPrompt] = useState(null);

      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [hideCompletedDone, setHideCompletedDone] = useState(false);
      const [priorityFilter, setPriorityFilter] = useState('all');
      const [sortBy, setSortBy] = useState('manual');
      const [newlyAddedProjectId, setNewlyAddedProjectId] = useState(null);

      const [expandedProjectId, setExpandedProjectId] = useState(null);
      const [activeStepId, setActiveStepId] = useState(null);

      useEffect(() => {
        const handleBeforeInstallPrompt = (e) => {
          e.preventDefault();
          setDeferredInstallPrompt(e);
        };
        const handleAppInstalled = () => {
          const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
          alert(isMobile 
            ? "App successfully installed! Please find it among your home screen icons." 
            : "App successfully installed! You can now launch it directly from your desktop, dock, or start menu.");
        };

        window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
        window.addEventListener('appinstalled', handleAppInstalled);
        return () => {
          window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
          window.removeEventListener('appinstalled', handleAppInstalled);
        };
      }, []);

      const handleInstallApp = async () => {
        if (deferredInstallPrompt) {
          deferredInstallPrompt.prompt();
          const { outcome } = await deferredInstallPrompt.userChoice;
          if (outcome === 'accepted') setDeferredInstallPrompt(null);
        } else {
          alert("To install on iOS:\n1. Tap the Share button (⎋) in Safari.\n2. Scroll down and tap 'Add to Home Screen' (⊞).");
        }
      };

      useEffect(() => {
        const handleOnline = () => setIsOnline(true);
        const handleOffline = () => setIsOnline(false);
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, []);

      useEffect(() => {
        if (!isFirebaseConfigured || !auth) {
          setLoading(false);
          return;
        }
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          if (!currentUser && !isDemoMode) {
            setProjects([]);
            setLoading(false);
          }
        });
        return () => unsubscribe();
      }, [isDemoMode]);

      useEffect(() => {
        if (isDemoMode) {
          setLoading(false);
          return;
        }

        if (!user || !db) return;
        setLoading(true);
        
        const userProjectsRef = db.collection('users').doc(user.uid).collection('projects');
        const unsubscribe = userProjectsRef.onSnapshot((snapshot) => {
          let loaded = snapshot.docs.map(doc => {
            const data = doc.data();
            const name = data.name || data.projectName || '';
            const briefStatus = data.briefStatus || data.statusBrief || (typeof data.status === 'string' && data.status.length > 15 ? data.status : '');
            const category = data.category || 'None';
            const priority = typeof data.priority === 'number' ? data.priority : 0;
            const status = (data.status === 'paused' || data.status === 'completed' || data.status === 'active') ? data.status : 'active';
            const archived = !!(data.archived || status === 'completed');
            const orderIndex = typeof data.orderIndex === 'number' ? data.orderIndex : (typeof data.order === 'number' ? data.order : 0);

            return {
              id: doc.id,
              name: name,
              briefStatus: briefStatus,
              category: category,
              priority: priority,
              status: status,
              archived: archived,
              orderIndex: orderIndex,
              nextSteps: normalizeSteps(data.nextSteps),
              notes: normalizeSteps(data.notes)
            };
          });

          setProjects(loaded);
          setLoading(false);
        }, (err) => {
          console.error("Firestore sync error:", err);
          setLoading(false);
        });

        return () => unsubscribe();
      }, [user, isDemoMode]);

      useEffect(() => {
        if (newlyAddedProjectId) {
          const el = document.getElementById(`project-name-${newlyAddedProjectId}`);
          if (el) {
            setExpandedProjectId(newlyAddedProjectId);
            setTimeout(() => {
              el.focus();
              el.select();
            }, 50);
            setNewlyAddedProjectId(null);
          }
        }
      }, [projects, newlyAddedProjectId]);

      useEffect(() => {
        localStorage.setItem('tracker_theme', isDarkMode ? 'dark' : 'light');
        if (isDarkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [isDarkMode]);

      const handleGoogleLogin = async () => {
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          await auth.signInWithPopup(provider);
          setIsDemoMode(false);
        } catch (err) { alert("Sign in failed: " + err.message); }
      };

      const handleLogout = () => {
        if (confirm("Sign out of your workspace?")) {
          auth.signOut();
          setIsDemoMode(false);
        }
      };

      const enableDemoMode = () => {
        setIsDemoMode(true);
        setProjects(DEMO_PROJECTS);
      };

      const updateProjectField = (id, field, value) => {
        if (isDemoMode) {
          setProjects(prev => prev.map(p => p.id === id ? { ...p, [field]: value } : p));
          return;
        }
        if (!user || !db) return;
        db.collection('users').doc(user.uid).collection('projects').doc(id).update({ [field]: value });
      };

      const addProject = async () => {
        setCurrentView('active');
        const maxOrder = projects.length > 0 ? Math.max(...projects.map(p => p.orderIndex || 0)) : 0;
        const newProj = {
          name: 'New Project',
          briefStatus: '',
          category: 'None',
          priority: 0,
          status: 'active',
          archived: false,
          orderIndex: maxOrder + 100,
          nextSteps: [{ id: `step-${Date.now()}`, text: '', completed: false, indent: 0 }],
          notes: []
        };

        if (isDemoMode) {
          const newId = `demo-${Date.now()}`;
          setProjects([...projects, { id: newId, ...newProj }]);
          setNewlyAddedProjectId(newId);
          return;
        }
        if (!user || !db) return;
        const docRef = await db.collection('users').doc(user.uid).collection('projects').add(newProj);
        setNewlyAddedProjectId(docRef.id);
      };

      const setProjectStatus = (id, newStatus) => {
        if (isDemoMode) {
          setProjects(prev => prev.map(p => p.id === id ? { ...p, status: newStatus, archived: newStatus === 'completed' } : p));
          return;
        }
        if (!user || !db) return;
        db.collection('users').doc(user.uid).collection('projects').doc(id).update({ status: newStatus, archived: newStatus === 'completed' });
      };

      const deleteProject = (id) => {
        if (!confirm('Permanently delete this project?')) return;
        if (isDemoMode) {
          setProjects(prev => prev.filter(p => p.id !== id));
          return;
        }
        if (!user || !db) return;
        db.collection('users').doc(user.uid).collection('projects').doc(id).delete();
      };

      const moveProject = (indexInView, direction) => {
        const viewProjects = displayedProjects;
        const targetViewIndex = direction === 'up' ? indexInView - 1 : indexInView + 1;
        if (targetViewIndex < 0 || targetViewIndex >= viewProjects.length) return;

        const p1 = viewProjects[indexInView];
        const p2 = viewProjects[targetViewIndex];
        const tempIndex = p1.orderIndex || 0;
        const targetIndex = p2.orderIndex || 0;

        if (isDemoMode) {
          setProjects(prev => prev.map(p => {
            if (p.id === p1.id) return { ...p, orderIndex: targetIndex };
            if (p.id === p2.id) return { ...p, orderIndex: tempIndex };
            return p;
          }));
          return;
        }

        if (!user || !db) return;
        const batch = db.batch();
        batch.update(db.collection('users').doc(user.uid).collection('projects').doc(p1.id), { orderIndex: targetIndex });
        batch.update(db.collection('users').doc(user.uid).collection('projects').doc(p2.id), { orderIndex: tempIndex });
        batch.commit();
      };

      const purgeProjectSubSteps = (projectId, field) => {
        const proj = projects.find(p => p.id === projectId);
        if (!proj) return;
        const remaining = (proj[field] || []).filter(s => !s.completed);
        updateProjectField(projectId, field, remaining);
      };

      const handleRowClick = (e, projectId) => {
        if (['INPUT', 'BUTTON', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
        setExpandedProjectId(prev => prev === projectId ? null : projectId);
      };

      // --- SUB-STEP CHECKLIST RENDERER ---
      const renderSubList = (project, field) => {
        const rawItems = normalizeSteps(project[field]);
        const items = hideCompletedDone ? rawItems.filter(s => !s.completed) : rawItems;

        const moveStep = (index, direction) => {
          const targetIdx = direction === 'up' ? index - 1 : index + 1;
          if (targetIdx < 0 || targetIdx >= rawItems.length) return;
          const updated = [...rawItems];
          const temp = updated[index];
          updated[index] = updated[targetIdx];
          updated[targetIdx] = temp;
          updateProjectField(project.id, field, updated);
        };

        const updateIndent = (index, direction) => {
          const updated = [...rawItems];
          const currentIndent = updated[index].indent || 0;
          updated[index].indent = direction === 'left' ? Math.max(0, currentIndent - 1) : Math.min(2, currentIndent + 1);
          updateProjectField(project.id, field, updated);
        };

        const handleKeyDown = (e, index, currentText) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            const updated = [...rawItems];
            updated[index].text = currentText.slice(0, MAX_NOTE_LENGTH);
            const newStep = { 
              id: `step-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`, 
              text: '', 
              completed: false, 
              indent: rawItems[index] ? rawItems[index].indent : 0 
            };
            updated.splice(index + 1, 0, newStep);
            updateProjectField(project.id, field, updated);
            
            setTimeout(() => {
              const nextInput = document.getElementById(`step-input-${project.id}-${field}-${index + 1}`);
              if (nextInput) nextInput.focus();
            }, 30);
          } else if (e.key === 'Tab') {
            e.preventDefault();
            updateIndent(index, e.shiftKey ? 'left' : 'right');
          } else if (e.key === 'Backspace' && currentText === '' && rawItems.length > 1) {
            e.preventDefault();
            const updated = rawItems.filter((_, i) => i !== index);
            updateProjectField(project.id, field, updated);
            setTimeout(() => {
              const prevInput = document.getElementById(`step-input-${project.id}-${field}-${Math.max(0, index - 1)}`);
              if (prevInput) prevInput.focus();
            }, 30);
          }
        };

        const updateStepText = (index, val) => {
          const updated = [...rawItems];
          updated[index].text = val.slice(0, MAX_NOTE_LENGTH);
          updateProjectField(project.id, field, updated);
        };

        const toggleStepComplete = (index) => {
          const updated = [...rawItems];
          updated[index].completed = !updated[index].completed;
          updateProjectField(project.id, field, updated);
        };

        const addEmptyStep = () => {
          updateProjectField(project.id, field, [...rawItems, { id: `step-${Date.now()}`, text: '', completed: false, indent: 0 }]);
        };

        const indentStyles = ['ml-0', 'ml-4 border-l-2 border-slate-300 dark:border-slate-700 pl-2', 'ml-8 border-l-2 border-amber-400 pl-2'];
        const completedCountInField = rawItems.filter(s => s.completed).length;

        return (
          <div className="space-y-0.5">
            {items.map((step, idx) => (
              <div key={step.id || idx} className={`group/step flex flex-col transition-all ${indentStyles[step.indent || 0]}`}>
                <div className="flex items-start gap-1.5">
                  <div className="hidden lg:flex flex-col text-[10px] text-slate-400 opacity-20 group-hover/step:opacity-100 transition pt-0.5">
                    <button onClick={() => moveStep(idx, 'up')} disabled={idx === 0} className="hover:text-amber-600 leading-none disabled:opacity-10">▲</button>
                    <button onClick={() => moveStep(idx, 'down')} disabled={idx === rawItems.length - 1} className="hover:text-amber-600 leading-none disabled:opacity-10">▼</button>
                  </div>
                  <input 
                    type="checkbox" 
                    checked={!!step.completed} 
                    onChange={() => toggleStepComplete(idx)} 
                    className="mt-0.5 h-4 w-4 rounded border-slate-400 text-amber-500 focus:ring-amber-400 cursor-pointer flex-shrink-0" 
                  />
                  <AutoResizeTextarea
                    id={`step-input-${project.id}-${field}-${idx}`}
                    value={step.text}
                    maxLength={MAX_NOTE_LENGTH}
                    placeholder={field === 'nextSteps' ? "Add action step..." : "Add note..."}
                    onSave={(val) => updateStepText(idx, val)}
                    onKeyDown={(e, currentVal) => handleKeyDown(e, idx, currentVal)}
                    onFocus={() => setActiveStepId(step.id)}
                    className={`text-sm font-normal py-0.5 leading-snug ${step.completed ? 'line-through text-slate-400 dark:text-slate-500 opacity-60' : 'text-slate-800 dark:text-slate-200'}`}
                  />
                </div>
                {activeStepId === step.id && (
                  <div className="lg:hidden flex items-center justify-start gap-2 mt-1 mb-2 ml-6">
                    <div className="flex bg-slate-200 dark:bg-slate-800 rounded-lg overflow-hidden text-xs">
                      <button onMouseDown={(e) => { e.preventDefault(); moveStep(idx, 'up'); }} disabled={idx === 0} className="px-2.5 py-1 text-slate-700 dark:text-slate-300 border-r border-slate-300 dark:border-slate-700">▲ Up</button>
                      <button onMouseDown={(e) => { e.preventDefault(); moveStep(idx, 'down'); }} disabled={idx === rawItems.length - 1} className="px-2.5 py-1 text-slate-700 dark:text-slate-300 border-r border-slate-300 dark:border-slate-700">▼ Down</button>
                      <button onMouseDown={(e) => { e.preventDefault(); updateIndent(idx, 'left'); }} disabled={(step.indent || 0) === 0} className="px-2.5 py-1 text-slate-700 dark:text-slate-300 border-r border-slate-300 dark:border-slate-700">⇥ Outdent</button>
                      <button onMouseDown={(e) => { e.preventDefault(); updateIndent(idx, 'right'); }} disabled={(step.indent || 0) === 2} className="px-2.5 py-1 text-slate-700 dark:text-slate-300">Indent ⇤</button>
                    </div>
                  </div>
                )}
              </div>
            ))}
            <div className="flex items-center gap-2.5 pt-0.5">
              <button onClick={addEmptyStep} className="text-xs text-slate-500 dark:text-slate-400 hover:text-amber-600 dark:hover:text-amber-400 font-medium inline-flex items-center gap-1">+ Add Item</button>
              {completedCountInField > 0 && (
                <><span className="text-slate-300 dark:text-slate-700">•</span><button onClick={() => purgeProjectSubSteps(project.id, field)} className="text-xs text-slate-400 hover:text-red-500 transition font-normal">Purge Done ({completedCountInField})</button></>
              )}
            </div>
          </div>
        );
      };

      const masterViewProjects = projects.filter(p => {
        if (currentView === 'active') return p.status === 'active';
        if (currentView === 'paused') return p.status === 'paused';
        if (currentView === 'completed') return p.status === 'completed' || p.archived;
        return true;
      });

      const filteredProjects = masterViewProjects.filter(p => {
        if (priorityFilter !== 'all') return p.priority === parseInt(priorityFilter, 10);
        return true;
      });

      const displayedProjects = [...filteredProjects].sort((a, b) => {
        if (sortBy === 'priority-desc') return b.priority - a.priority;
        if (sortBy === 'priority-asc') return a.priority - b.priority;
        return (a.orderIndex || 0) - (b.orderIndex || 0);
      });

      const activeCount = projects.filter(p => p.status === 'active' && !p.archived).length;
      const pausedCount = projects.filter(p => p.status === 'paused').length;
      const completedCount = projects.filter(p => p.status === 'completed' || p.archived).length;
      const isManualOrderingActive = sortBy === 'manual' && priorityFilter === 'all';

      // =========================================================================
      // LANDING & LOGIN PAGE (EXECUTIVE DESIGN)
      // =========================================================================
      if (!user && !isDemoMode) {
        return (
          <div className="min-h-screen bg-[#0d131f] text-slate-100 flex flex-col items-center font-sans selection:bg-amber-500 selection:text-slate-900">
            
            {/* HERO SECTION */}
            <div className="max-w-5xl w-full px-6 pt-24 pb-16 flex flex-col items-center text-center">
              <h1 className="text-5xl sm:text-6xl md:text-7xl font-extrabold text-white tracking-tight mb-6">
                Sharpen your focus.
              </h1>
              <h2 className="text-xl sm:text-2xl md:text-3xl font-medium text-slate-300 mb-6 max-w-3xl leading-snug">
                Work on what matters, right now, this week. <span className="text-amber-500">Pause everything else.</span>
              </h2>
              <p className="text-base sm:text-lg text-slate-400 mb-10 max-w-2xl leading-relaxed">

              </p>

                <button 
                  onClick={handleGoogleLogin} 
                  className="w-full sm:w-auto bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3.5 px-8 rounded-full shadow-[0_0_20px_rgba(245,158,11,0.3)] transition-all transform hover:-translate-y-0.5 text-base"
                >
                  Create Yours — 100% Free
                </button>
                <a 
                  href="#preview-board"
                  onClick={(e) => {
                    e.preventDefault();
                    document.getElementById('preview-board')?.scrollIntoView({ behavior: 'smooth' });

                  className="w-full sm:w-auto bg-transparent border-2 border-slate-700 hover:border-slate-500 text-slate-300 hover:text-white font-semibold py-3.5 px-8 rounded-full transition-colors text-base"
                >
                  Explore Live Demo
                </a>
              </div>

              <p className="mt-8 text-sm text-slate-500 font-medium">
                ⚡ Instant setup • No credit card required • Private browser persistence
              </p>
            </div>

            {/* FEATURES & LIVE PREVIEW BOARD */}
            <div className="max-w-6xl w-full px-4 sm:px-8 pb-24 space-y-12" id="preview-board">
              
              {/* 4 CORE USE-CASE CARDS */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div className="bg-[#131b2e] border border-slate-800 rounded-2xl p-5 space-y-2">
                  <div className="text-2xl">✨</div>
                  <h3 className="text-base font-bold text-white">Pure Simplistic</h3>
                  <p className="text-xs text-slate-400 leading-relaxed">Zero configuration or admin bloat. Focus purely on execution.</p>
                </div>
                <div className="bg-[#131b2e] border border-slate-800 rounded-2xl p-5 space-y-2">
                  <div className="text-2xl">🎯</div>
                  <h3 className="text-base font-bold text-white">Track Active Projects</h3>
                  <p className="text-xs text-slate-400 leading-relaxed">A single high-density view for all active streams.</p>
                </div>
                <div className="bg-[#131b2e] border border-slate-800 rounded-2xl p-5 space-y-2">
                  <div className="text-2xl">📋</div>
                  <h3 className="text-base font-bold text-white">Done & What's Next</h3>
                  <p className="text-xs text-slate-400 leading-relaxed">Immediate clarity on completed milestones and next steps.</p>
                </div>
                <div className="bg-[#131b2e] border border-slate-800 rounded-2xl p-5 space-y-2">
                  <div className="text-2xl">🔒</div>
                  <h3 className="text-base font-bold text-white">Keep It Private</h3>
                  <p className="text-xs text-slate-400 leading-relaxed">Avoid cognitive overwhelm in an isolated secure workspace.</p>
                </div>
              </div>

              {/* LIVE BOARD PREVIEW CARD WITH SANDBOX OVERLAY CTA */}
              <div className="relative bg-[#131b2e] border border-slate-800 rounded-2xl p-5 space-y-4 group">
                
                {/* Overlay CTA for Demo */}
                <div className="absolute inset-0 z-10 bg-[#0d131f]/40 backdrop-blur-[2px] opacity-0 group-hover:opacity-100 transition-opacity duration-300 rounded-2xl flex flex-col items-center justify-center">
                  <button onClick={enableDemoMode} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 px-8 rounded-full shadow-[0_0_30px_rgba(245,158,11,0.5)] transition-transform transform hover:scale-105 text-lg">
                    Launch Interactive Sandbox
                  </button>
                </div>

                <div className="flex items-center justify-between border-b border-slate-800/80 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="w-3 h-3 rounded-full bg-rose-500 inline-block"></span>
                    <span className="w-3 h-3 rounded-full bg-amber-500 inline-block"></span>
                    <span className="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
                  </div>
                </div>

                {/* Desktop Preview */}
                <div className="hidden lg:block overflow-x-auto rounded-xl border border-slate-800 bg-[#131b2e]">
                  <table className="w-full text-left border-collapse text-xs">
                    <thead className="bg-amber-400 text-slate-950 font-black uppercase tracking-wider">
                      <tr>
                        <th className="p-3 w-[18%]">PROJECT NAME</th>
                        <th className="p-3 w-[18%]">STATUS BRIEF</th>
                        <th className="p-3 w-[27%]">NEXT STEPS</th>
                        <th className="p-3 w-[10%] text-center">CATEGORY</th>
                        <th className="p-3 w-[24%]">NOTES</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800 bg-[#0b101d] text-slate-300">
                      <tr>
                        <td className="p-3 font-semibold text-white border-l-4 border-emerald-500">Home Network & Private NAS</td>
                        <td className="p-3 text-slate-300 bg-[#131b2e]/60 border-x border-slate-800">Setting up local storage server and encrypted cloud sync.</td>
                        <td className="p-3 font-semibold text-white"><div className="text-emerald-400">• Set up nightly encrypted offsite backup job</div></td>
                        <td className="p-3 text-center align-top">
                          <div className="flex flex-col gap-1.5 items-center">
                            <span className="px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-800 font-semibold w-full block text-center">Personal</span>
                            <div className="w-full flex items-center justify-center bg-slate-800/80 border border-slate-700 h-7 rounded">
                              <span className="text-rose-400 font-mono font-black text-lg tracking-tighter whitespace-nowrap">{"!\u00A0!"}</span>
                            </div>
                          </div>
                        </td>
                        <td className="p-3 text-slate-400">Static IP reservation on router.</td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                {/* Mobile Preview */}
                <div className="block lg:hidden overflow-x-hidden rounded-xl border border-slate-800 bg-[#0b101d] text-slate-300 text-xs">
                  <div className="flex justify-between items-center p-3.5 border-b border-slate-800 font-semibold text-white border-l-4 border-emerald-500 bg-[#131b2e]">
                    <span>Home Network Setup</span>
                    <svg className="w-5 h-5 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" /></svg>
                  </div>
                  <div className="p-3.5 border-b border-slate-800">
                    <div className="flex gap-2.5">
                      <div className="w-[75%]"><label className="text-[11px] uppercase font-black text-slate-500 block mb-1.5 border-b border-slate-800 pb-0.5">Category</label><span className="px-2 py-1 rounded bg-emerald-950 text-emerald-300 border border-emerald-800 font-semibold w-full block text-center">Personal</span></div>
                      <div className="w-[25%]"><label className="text-[11px] uppercase font-black text-slate-500 block mb-1.5 border-b border-slate-800 pb-0.5 text-center">Priority</label><div className="w-full flex items-center justify-center bg-slate-800/80 border border-slate-700 h-7 rounded"><span className="text-rose-400 font-mono font-black text-lg tracking-tighter whitespace-nowrap">{"!\u00A0!"}</span></div></div>
                    </div>
                  </div>
                  <div className="p-3.5 bg-[#131b2e]/60 border-b border-slate-800">
                    <label className="text-[11px] uppercase font-black text-slate-500 block mb-1.5 border-b border-slate-800 pb-0.5">Status Brief</label>Setting up local network storage.
                  </div>
                </div>

              </div>

            </div>
          </div>
        );
      }

      // =========================================================================
      // MAIN DASHBOARD WORKSPACE 
      // =========================================================================
      return (
        <div className="max-w-[1440px] mx-auto p-4 sm:p-6 space-y-4">
          
          <header className="flex flex-col lg:flex-row items-end lg:items-center justify-between w-full gap-3 bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
            <div className="flex flex-col lg:flex-row items-start lg:items-center gap-3 w-full lg:w-auto justify-between lg:justify-start">
              <div className="flex w-full lg:w-auto justify-between items-center gap-2">
                <h1 className="text-lg font-bold tracking-tight text-slate-900 dark:text-white">PERSONAL PROJECT TRACKER</h1>
                <div className="lg:hidden">
                  {isDemoMode ? (
                    <button onClick={handleLogout} className="text-[10px] font-medium px-2.5 py-1 rounded-full border bg-purple-100 text-purple-800 border-purple-300 dark:bg-purple-900/60 dark:text-purple-300 hover:bg-purple-200 transition">🧪 Exit Demo</button>
                  ) : !isOnline ? (
                    <span className="text-[10px] font-medium px-2 py-0.5 rounded-full border bg-amber-500 text-slate-950 animate-pulse">📡 Offline</span>
                  ) : (
                    <span className="text-[10px] font-medium px-2 py-0.5 rounded-full border bg-emerald-50 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-400">☁️ Synced</span>
                  )}
                </div>
              </div>
              <div className="flex items-center w-full lg:w-auto bg-slate-100 dark:bg-slate-950 p-1 rounded-lg border border-slate-200 dark:border-slate-800 shrink-0">
                <button onClick={() => setCurrentView('active')} className={`flex-1 lg:flex-none px-3.5 py-1.5 rounded-md text-xs font-semibold transition flex justify-center items-center gap-1.5 ${currentView === 'active' ? 'bg-white dark:bg-slate-800 text-amber-600 dark:text-amber-400 shadow-sm' : 'text-slate-600 dark:text-slate-400'}`}>Active <span className="text-[11px] bg-slate-200 dark:bg-slate-700 px-1.5 py-0.5 rounded-full">{activeCount}</span></button>
                <button onClick={() => setCurrentView('paused')} className={`flex-1 lg:flex-none px-3.5 py-1.5 rounded-md text-xs font-semibold transition flex justify-center items-center gap-1.5 ${currentView === 'paused' ? 'bg-white dark:bg-slate-800 text-amber-600 dark:text-amber-400 shadow-sm' : 'text-slate-600 dark:text-slate-400'}`}>Paused <span className="text-[11px] bg-slate-200 dark:bg-slate-700 px-1.5 py-0.5 rounded-full">{pausedCount}</span></button>
                <button onClick={() => setCurrentView('completed')} className={`flex-1 lg:flex-none px-3.5 py-1.5 rounded-md text-xs font-semibold transition flex justify-center items-center gap-1.5 ${currentView === 'completed' ? 'bg-white dark:bg-slate-800 text-emerald-600 dark:text-emerald-400 shadow-sm' : 'text-slate-600 dark:text-slate-400'}`}>Completed <span className="text-[11px] bg-slate-200 dark:bg-slate-700 px-1.5 py-0.5 rounded-full">{completedCount}</span></button>
              </div>
            </div>

            <div className="flex flex-col lg:flex-row items-end lg:items-center justify-between w-full lg:w-auto gap-2">

                 </button>
                 <button onClick={addProject} className="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-1.5 rounded-lg text-xs shadow-sm transition">+ New Project</button>

              <div className={`${mobileMenuOpen ? 'grid grid-cols-2 w-full' : 'hidden'} lg:flex lg:flex-row items-center gap-2`}>

                    <select value={priorityFilter} onChange={(e) => setPriorityFilter(e.target.value)} className="bg-transparent text-xs font-semibold text-slate-800 dark:text-slate-200 cursor-pointer w-full">
                      <option value="all">All Priorities</option><option value="2">!! High</option><option value="1">! Medium</option><option value="0">Normal</option>
                    </select>
                 </div>
                 <div className="flex items-center bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1.5 text-xs w-full lg:w-auto">

                    <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="bg-transparent text-xs font-semibold text-slate-800 dark:text-slate-200 cursor-pointer w-full">

                 </div>
                 <button onClick={() => setHideCompletedDone(!hideCompletedDone)} className={`px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition flex items-center justify-center gap-1 w-full lg:w-auto ${hideCompletedDone ? 'bg-amber-500 text-slate-950 border-amber-600 shadow-sm' : 'bg-slate-100 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300'}`}>

                 </button>
                 <button onClick={() => setIsDarkMode(!isDarkMode)} className="px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-xs font-medium w-full lg:w-auto flex justify-center">
                    {isDarkMode ? '☀️ Light' : '🌙 Dark'}
                 </button>
              </div>

              <div className="hidden lg:flex items-center gap-2 ml-2">
                 <button onClick={addProject} className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-3.5 py-1.5 rounded-lg text-xs shadow-sm transition">+ New Project</button>
                 <button onClick={handleInstallApp} className="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-xs font-bold border border-slate-200 dark:border-slate-700" title="Install App">📲</button>
                 <div className="flex items-center gap-2 ml-2">
                  {isDemoMode ? (
                    <button onClick={handleLogout} className="text-[11px] font-medium px-2.5 py-1 rounded-full border bg-purple-100 text-purple-800 border-purple-300 dark:bg-purple-900/60 dark:text-purple-300 hover:bg-purple-200 transition">🧪 Exit Demo</button>
                  ) : !isOnline ? (
                    <span className="text-[10px] font-medium px-2 py-0.5 rounded-full border bg-amber-500 text-slate-950 animate-pulse">📡 Offline</span>
                  ) : (
                    <span className="text-[10px] font-medium px-2 py-0.5 rounded-full border bg-emerald-50 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-400">☁️ Synced</span>
                  )}
                  {user && <button onClick={handleLogout} className="text-xs text-slate-400 hover:text-red-500 font-medium transition ml-1">Sign Out</button>}
                 </div>
              </div>

              <div className={`${mobileMenuOpen ? 'flex' : 'hidden'} lg:hidden w-full items-center justify-between pt-2 mt-1 border-t border-slate-200 dark:border-slate-700`}>
                 <button onClick={handleInstallApp} className="text-xs text-amber-600 dark:text-amber-400 font-bold transition flex items-center gap-1">📲 Install App</button>
                 {user && <button onClick={handleLogout} className="text-xs text-slate-500 hover:text-red-500 font-medium transition flex items-center gap-2">Sign Out</button>}
              </div>
            </div>
          </header>

          {/* TABLE CONTAINER */}
          <div className="lg:bg-white lg:dark:bg-slate-900 lg:rounded-xl lg:border lg:border-slate-200 lg:dark:border-slate-800 lg:shadow-sm overflow-x-hidden lg:overflow-x-auto">
            {loading ? (
              <div className="p-12 text-center text-xs font-mono text-slate-400 bg-white dark:bg-slate-900 rounded-xl">Loading workspace...</div>
            ) : (
              <div className="block lg:table w-full text-left border-collapse lg:min-w-[1100px]">
                
                {/* VIBRANT WARM AMBER HEADER */}
                <div className="hidden lg:table-header-group">
                  <div className="lg:table-row bg-amber-400 text-slate-950 dark:bg-amber-500 dark:text-slate-950 text-xs font-black uppercase tracking-wider">
                    <div className="lg:table-cell p-3.5 w-[18%]">Project Name</div>
                    <div className="lg:table-cell p-3.5 w-[18%]">Status Brief</div>
                    <div className="lg:table-cell p-3.5 w-[27%]">Next Steps</div>
                    <div className="lg:table-cell p-3.5 w-[10%] text-center">Category</div>
                    <div className="lg:table-cell p-3.5 w-[24%]">Notes</div>
                  </div>
                </div>

                <div className="block lg:table-row-group">
                  {displayedProjects.length === 0 ? (
                    <div className="block lg:table-row bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800">
                      <div className="lg:table-cell p-12 text-center text-slate-400 text-sm">No projects found in <strong>{currentView}</strong> view. Click "+ New Project" to get started.</div>
                    </div>
                  ) : (
                    displayedProjects.map((p, index) => {
                      const colorScheme = CATEGORY_COLORS[p.category] || CATEGORY_COLORS['None'];
                      const isExpanded = expandedProjectId === p.id;
                      const isArchivedRow = p.archived || p.status === 'completed';

                      return (
                        <div key={p.id} className={`block lg:table-row bg-white dark:bg-slate-900 ${colorScheme.tint} border border-slate-200 dark:border-slate-800 mb-3 lg:mb-0 rounded-xl lg:rounded-none overflow-hidden transition-colors duration-150 lg:border-x-0 lg:border-t-0 lg:border-b hover:bg-slate-100/80 lg:dark:hover:bg-slate-800/80 ${isArchivedRow ? 'opacity-60' : ''}`}>
                          
                          {/* 1. PROJECT NAME */}
                          <div onClick={(e) => handleRowClick(e, p.id)} className={`block lg:table-cell p-3.5 align-top cursor-pointer lg:cursor-default border-l-4 ${colorScheme.border} lg:border-r ${isDarkMode ? 'lg:border-r-slate-800' : 'lg:border-r-slate-200'}`}>
                            <div className="flex items-start gap-2.5">
                              {isManualOrderingActive && (
                                <div className="hidden lg:flex flex-col text-xs text-slate-400 pt-0.5 opacity-40 hover:opacity-100 transition">
                                  <button onClick={() => moveProject(index, 'up')} disabled={index === 0} className="hover:text-amber-600 leading-none p-0.5 disabled:opacity-10">▲</button>
                                  <button onClick={() => moveProject(index, 'down')} disabled={index === displayedProjects.length - 1} className="hover:text-amber-600 leading-none p-0.5 disabled:opacity-10">▼</button>
                                </div>
                              )}
                              <div className="flex-1 min-w-0 break-words">
                                <AutoResizeTextarea id={`project-name-${p.id}`} value={p.name} maxLength={MAX_NAME_LENGTH} placeholder="Project Name..." onSave={(v) => updateProjectField(p.id, 'name', v)} className={`font-semibold text-base leading-snug ${isDarkMode ? 'text-white' : 'text-slate-900'} cursor-text break-words whitespace-pre-wrap`} />
                                <div className="mt-0.5 lg:mt-2 flex flex-wrap items-center gap-2 text-[11px] lg:text-xs text-slate-400 dark:text-slate-500 font-normal">
                                  {currentView === 'active' && (<><button onClick={() => setProjectStatus(p.id, 'paused')} className="hover:text-slate-700 dark:hover:text-slate-300">Pause</button><span>•</span><button onClick={() => setProjectStatus(p.id, 'completed')} className="hover:text-slate-700 dark:hover:text-slate-300">Complete</button></>)}
                                  {currentView === 'paused' && (<><button onClick={() => setProjectStatus(p.id, 'active')} className="hover:text-slate-700 dark:hover:text-slate-300">Resume</button><span>•</span><button onClick={() => setProjectStatus(p.id, 'completed')} className="hover:text-slate-700 dark:hover:text-slate-300">Complete</button></>)}
                                  {currentView === 'completed' && (<button onClick={() => setProjectStatus(p.id, 'active')} className="hover:text-slate-700 dark:hover:text-slate-300">Reactivate</button>)}
                                  <span>•</span><button onClick={() => deleteProject(p.id)} className="hover:text-red-500">Delete</button>
                                </div>
                              </div>
                              <div className="lg:hidden pt-1 text-slate-400"><svg className={`w-5 h-5 transition-transform ${isExpanded ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" /></svg></div>
                            </div>
                          </div>

                          <div className={`lg:contents flex flex-col ${isExpanded ? '' : 'hidden'}`}>
                            
                            {/* 4 & 5. COMBINED PRIORITY & CATEGORY */}
                            <div className={`block lg:table-cell p-3.5 align-top border-t lg:border-t-0 lg:border-r border-slate-100 dark:border-slate-800 ${isDarkMode ? 'lg:border-r-slate-800' : 'lg:border-r-slate-200'} order-1 lg:order-none`}>
                              <div className="flex flex-row lg:flex-col gap-2.5 items-end lg:items-stretch">
                                <div className="w-[75%] lg:w-full">
                                  <label className="lg:hidden text-[11px] uppercase font-black text-slate-500 block mb-1.5 border-b border-slate-200 dark:border-slate-700 pb-0.5 tracking-wider">Category</label>
                                  <select value={p.category || 'None'} onChange={(e) => updateProjectField(p.id, 'category', e.target.value)} className={`text-xs p-1.5 rounded font-semibold border cursor-pointer transition w-full h-8 ${colorScheme.badge}`}>
                                    {CATEGORIES.map(c => <option key={c} value={c} className="bg-white text-slate-800 font-normal">{c}</option>)}
                                  </select>
                                </div>
                                <div className="w-[25%] lg:w-full">
                                  <label className="lg:hidden text-[11px] uppercase font-black text-slate-500 block mb-1.5 border-b border-slate-200 dark:border-slate-700 pb-0.5 tracking-wider text-center">Priority</label>
                                  <PriorityCell priority={p.priority} onChange={(newPriority) => updateProjectField(p.id, 'priority', newPriority)} />
                                </div>
                              </div>
                            </div>
                            
                            {/* 2. CONTEXT ANCHOR: STATUS BRIEF */}
                            <div className={`block lg:table-cell p-3.5 align-top bg-slate-100/50 dark:bg-slate-800/40 border-t lg:border-t-0 lg:border-x border-slate-200/80 dark:border-slate-800 order-2 lg:order-none`}>
                              <label className="lg:hidden text-[11px] uppercase font-black text-slate-500 block mb-1.5 border-b border-slate-200 dark:border-slate-700 pb-0.5 tracking-wider">Status Brief</label>
                              <AutoResizeTextarea value={p.briefStatus || ''} maxLength={MAX_NOTE_LENGTH} placeholder="Status brief..." onSave={(v) => updateProjectField(p.id, 'briefStatus', v)} className={`text-sm leading-relaxed ${isDarkMode ? 'text-slate-200' : 'text-slate-800'}`} />
                            </div>

                            {/* 3. ACTION ZONE: NEXT STEPS */}
                            <div className={`block lg:table-cell p-3.5 align-top border-t lg:border-t-0 lg:border-r border-slate-100 dark:border-slate-800 ${isDarkMode ? 'lg:border-r-slate-800' : 'lg:border-r-slate-200'} order-3 lg:order-none`}>
                              <label className="lg:hidden text-[11px] uppercase font-black text-slate-500 block mb-1.5 border-b border-slate-200 dark:border-slate-700 pb-0.5 tracking-wider">Next Steps</label>
                              {renderSubList(p, 'nextSteps')}
                            </div>

                            {/* 6. NOTES */}
                            <div className="block lg:table-cell p-3.5 align-top border-t lg:border-t-0 border-slate-100 dark:border-slate-800 text-slate-600 dark:text-slate-400 order-4 lg:order-none">
                              <label className="lg:hidden text-[11px] uppercase font-black text-slate-500 block mb-1.5 border-b border-slate-200 dark:border-slate-700 pb-0.5 tracking-wider">Notes</label>
                              {renderSubList(p, 'notes')}
                            </div>

                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    class ErrorBoundary extends Component {
      constructor(props) { super(props); this.state = { hasError: false }; }
      static getDerivedStateFromError() { return { hasError: true }; }
      render() {
        if (this.state.hasError) return <div className="p-8 text-center max-w-md mx-auto my-12 bg-white dark:bg-slate-900 border rounded-xl shadow-xl"><h2 className="text-base font-bold text-red-600 mb-2">Workspace Render Error</h2><p className="text-xs text-slate-500 mb-4">A component state error occurred. Reloading will reset your view layout.</p><button onClick={() => window.location.reload()} className="px-4 py-2 bg-amber-500 text-slate-950 font-semibold rounded-lg text-xs">Reload Workspace</button></div>;
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
