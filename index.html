<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Project Tracker</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const { useState, useEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyCiQU2ilhdlJkxD7-kWHl6lkO2LKQYnC7E",
      authDomain: "master-tracker-7b104.firebaseapp.com",
      projectId: "master-tracker-7b104",
      storageBucket: "master-tracker-7b104.firebasestorage.app",
      messagingSenderId: "706171177063",
      appId: "1:706171177063:web:ac2415157560969c5a6cc2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    const CATEGORY_COLORS = {
      'Personal': 'bg-blue-100 text-blue-800',
      'Career': 'bg-amber-100 text-amber-900',
      'Family': 'bg-pink-100 text-pink-800',
      'Spiritual': 'bg-green-100 text-green-800',
      'Financial': 'bg-purple-100 text-purple-800',
      '': 'bg-slate-100 text-slate-500'
    };

    const IconPlus = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M5 12h14"/></svg>;
    const IconSparkles = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-purple-600"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>;
    const IconSquare = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>;

    const AutoResizeTextarea = ({ value, onSave, onKeyDown, className }) => {
      const [localValue, setLocalValue] = useState(value);
      useEffect(() => setLocalValue(value), [value]);
      const resize = (t) => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; };
      return <textarea value={localValue} onChange={(e) => { setLocalValue(e.target.value); resize(e.target); }} onBlur={(e) => { if (localValue !== value) onSave(localValue); }} onKeyDown={onKeyDown} onFocus={(e) => resize(e.target)} className={className} rows={1} style={{ overflow: 'hidden' }} />;
    };

    function App() {
      const [user, setUser] = useState(null);
      const [projects, setProjects] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, (u) => { setUser(u); setLoading(false); });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        const unsubscribe = onSnapshot(collection(db, 'users', user.uid, 'projects'), (snap) => {
          setProjects(snap.docs.map(d => d.data()).sort((a,b) => b.id - a.id));
        });
        return () => unsubscribe();
      }, [user]);

      const addProject = async () => {
        const id = Date.now();
        await setDoc(doc(db, 'users', user.uid, 'projects', id.toString()), { id, name: 'New Project', category: '', status: '', nextSteps: [], comingUp: [] });
      };

      const updateProject = async (id, field, val) => await updateDoc(doc(db, 'users', user.uid, 'projects', id.toString()), { [field]: val });

      const renderList = (p, listType) => (
        <div className="flex flex-col gap-1">
          {p[listType].map((item, idx) => (
            <div key={item.id} className="flex gap-2 group">
              <button className="mt-1 text-slate-400"><IconSquare /></button>
              <AutoResizeTextarea value={item.text} onSave={(v) => {
                const list = [...p[listType]]; list[idx].text = v; updateProject(p.id, listType, list);
              }} className="w-full text-xs bg-transparent outline-none resize-none" />
            </div>
          ))}
          <button onClick={() => updateProject(p.id, listType, [...p[listType], { id: Date.now(), text: '', done: false }])} className="text-[10px] text-blue-600 font-bold mt-1 flex items-center gap-1"><IconPlus /> Add Task</button>
        </div>
      );

      if (loading) return <div className="p-8">Loading...</div>;
      if (!user) return <div className="p-8"><button onClick={() => signInWithPopup(auth, googleProvider)} className="bg-blue-600 text-white p-2 rounded">Login</button></div>;

      return (
        <div className="min-h-screen bg-slate-50 p-6 font-sans">
          <div className="max-w-[1400px] mx-auto bg-white rounded-lg border border-slate-200 overflow-hidden">
            <table className="w-full text-left border-collapse table-fixed">
              <thead>
                <tr className="bg-slate-100 text-slate-500 text-[9px] uppercase tracking-widest border-b">
                  <th className="p-3 w-[15%]">Project</th>
                  <th className="p-3 w-[10%]">Category</th>
                  <th className="p-3 w-[25%]">Status</th>
                  <th className="p-3 w-[25%]">Steps</th>
                  <th className="p-3 w-[25%]">Notes</th>
                </tr>
              </thead>
              <tbody className="divide-y">
                {projects.map(p => (
                  <tr key={p.id}>
                    <td className="p-3 border-r"><AutoResizeTextarea value={p.name} onSave={(v) => updateProject(p.id, 'name', v)} className="w-full font-bold bg-transparent outline-none resize-none" /></td>
                    <td className="p-3 border-r"><select value={p.category} onChange={(e) => updateProject(p.id, 'category', e.target.value)} className={`text-[10px] p-1 rounded ${CATEGORY_COLORS[p.category] || 'bg-slate-100'}`}><option value="">None</option><option value="Personal">Personal</option><option value="Career">Career</option></select></td>
                    <td className="p-3 border-r relative group"><AutoResizeTextarea value={p.status} onSave={(v) => updateProject(p.id, 'status', v)} className="w-full text-xs bg-transparent outline-none resize-none" /><button className="absolute bottom-2 right-2 opacity-0 group-hover:opacity-100"><IconSparkles /></button></td>
                    <td className="p-3 border-r">{renderList(p, 'nextSteps')}</td>
                    <td className="p-3">{renderList(p, 'comingUp')}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
