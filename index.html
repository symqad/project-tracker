<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Project Tracker</title>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect, useRef, useLayoutEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyCiQU2ilhdlJkxD7-kWHl6lkO2LKQYnC7E",
      authDomain: "master-tracker-7b104.firebaseapp.com",
      projectId: "master-tracker-7b104",
      storageBucket: "master-tracker-7b104.firebasestorage.app",
      messagingSenderId: "706171177063",
      appId: "1:706171177063:web:ac2415157560969c5a6cc2"
    };
    
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const CATEGORIES = ['Personal', 'Career', 'Family', 'Spiritual', 'Financial'];

    const AutoResizeTextarea = ({ value, onSave, className }) => {
      const textareaRef = useRef(null);
      const [localValue, setLocalValue] = useState(value || '');
      useLayoutEffect(() => {
        if (textareaRef.current) {
          textareaRef.current.style.height = 'auto';
          textareaRef.current.style.height = textareaRef.current.scrollHeight + 'px';
        }
      }, [localValue]);
      
      return (
        <textarea ref={textareaRef} value={localValue} onChange={(e) => setLocalValue(e.target.value)}
          onBlur={() => onSave(localValue)} className={`${className} resize-none overflow-hidden bg-transparent w-full`} rows={1} />
      );
    };

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [projects, setProjects] = useState([]);

      useEffect(() => {
        return auth.onAuthStateChanged((u) => {
          setUser(u);
          setLoading(false);
        });
      }, []);

      useEffect(() => {
        if (!user) return;
        return db.collection('users').doc(user.uid).collection('projects')
          .onSnapshot(snapshot => setProjects(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
      }, [user]);

      const updateProject = (id, data) => db.collection('users').doc(user.uid).collection('projects').doc(id).set(data, { merge: true });

      const createProject = () => db.collection('users').doc(user.uid).collection('projects').add({
        name: 'New Project',
        category: 'Personal',
        status: '',
        nextSteps: [],
        notes: []
      });

      const renderList = (project, field) => (
        <div className="flex flex-col gap-1 text-sm">
          {(project[field] || []).map((item, idx) => (
            <div key={idx} className="flex items-center gap-2">
              <input type="checkbox" checked={item.done} onChange={() => {
                const list = [...project[field]];
                list[idx].done = !list[idx].done;
                updateProject(project.id, { [field]: list });
              }} />
              <input value={item.text} onChange={(e) => {
                const list = [...project[field]];
                list[idx].text = e.target.value;
                updateProject(project.id, { [field]: list });
              }} className="bg-transparent border-b border-transparent hover:border-slate-300 w-full" />
            </div>
          ))}
          <button onClick={() => updateProject(project.id, { [field]: [...(project[field] || []), { text: '', done: false }] })} className="text-xs text-slate-400 mt-1 hover:text-amber-600">+ Add</button>
        </div>
      );

      if (loading) return <div className="h-screen flex items-center justify-center">Authenticating...</div>;
      if (!user) return (
        <div className="h-screen flex flex-col items-center justify-center gap-4 bg-slate-100">
          <button onClick={() => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())} className="px-6 py-3 bg-white border rounded-lg shadow-sm">Sign in with Google</button>
        </div>
      );

      return (
        <div className="p-6 bg-slate-50 min-h-screen">
          <div className="max-w-[1200px] mx-auto bg-white rounded-lg border shadow-sm overflow-hidden">
            <table className="w-full text-left border-collapse">
              <thead className="bg-amber-400 text-amber-950 text-sm uppercase tracking-wider font-bold">
                <tr><th className="p-5">Project</th><th className="p-5">Category</th><th className="p-5">Status</th><th className="p-5">Next Steps</th><th className="p-5">Notes</th></tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {projects.map(p => (
                  <tr key={p.id}>
                    <td className="p-5 font-bold"><input value={p.name} onChange={(e) => updateProject(p.id, { name: e.target.value })} className="bg-transparent w-full" /></td>
                    <td className="p-5">
                      <select value={p.category} onChange={(e) => updateProject(p.id, { category: e.target.value })} className="bg-transparent border-none">
                        {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </td>
                    <td className="p-5"><AutoResizeTextarea value={p.status} onSave={(v) => updateProject(p.id, { status: v })} /></td>
                    <td className="p-5 align-top">{renderList(p, 'nextSteps')}</td>
                    <td className="p-5 align-top">{renderList(p, 'notes')}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="p-5 border-t">
              <button onClick={createProject} className="px-4 py-2 bg-amber-500 text-white rounded hover:bg-amber-600 font-bold">+ New Project</button>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
