<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Project Tracker</title>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect, useRef, useLayoutEffect } = React;

    const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

    const CATEGORY_COLORS = {
      'Personal': { border: 'border-l-blue-500', bg: 'bg-blue-100 bg-opacity-5', text: 'text-blue-800' },
      'Career': { border: 'border-l-amber-500', bg: 'bg-amber-100 bg-opacity-5', text: 'text-amber-900' },
      'Family': { border: 'border-l-pink-500', bg: 'bg-pink-100 bg-opacity-5', text: 'text-pink-800' },
      'Spiritual': { border: 'border-l-green-500', bg: 'bg-green-100 bg-opacity-5', text: 'text-green-800' },
      'Financial': { border: 'border-l-purple-500', bg: 'bg-purple-100 bg-opacity-5', text: 'text-purple-800' },
      '': { border: 'border-l-slate-300', bg: 'bg-slate-100 bg-opacity-5', text: 'text-slate-500' }
    };

    const AutoResizeTextarea = ({ value, onSave, onKeyDown, autoFocus, className }) => {
      const textareaRef = useRef(null);
      const [localValue, setLocalValue] = useState(value);
      useLayoutEffect(() => {
        if (textareaRef.current) {
          textareaRef.current.style.height = 'auto';
          textareaRef.current.style.height = textareaRef.current.scrollHeight + 'px';
        }
      }, [value]);
      useEffect(() => { setLocalValue(value); }, [value]);
      
      return (
        <textarea ref={textareaRef} value={localValue} onChange={(e) => setLocalValue(e.target.value)}
          onBlur={() => onSave(localValue)} onKeyDown={(e) => onKeyDown(e, localValue)}
          autoFocus={autoFocus} className={`${className} resize-none overflow-hidden`} rows={1} />
      );
    };

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [projects, setProjects] = useState([]);
      const [focusId, setFocusId] = useState(null);

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((u) => {
          setUser(u);
          setLoading(false);
        });
        return unsubscribe;
      }, []);

      useEffect(() => {
        if (!user) return;
        const q = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('projects');
        return q.onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setProjects(data.length ? data : [{ id: '1', name: 'New Project', category: 'Career', status: '', nextSteps: [], notes: [] }]);
        });
      }, [user]);

      const handleGoogleLogin = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
      const updateProjectField = (id, field, val) => {
        const docRef = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('projects').doc(id.toString());
        docRef.set({ ...projects.find(p => p.id === id), [field]: val }, { merge: true });
      };

      if (loading) return <div className="h-screen flex items-center justify-center">Authenticating...</div>;
      if (!user) return (
        <div className="h-screen flex flex-col items-center justify-center gap-4 bg-slate-100">
          <h1 className="text-2xl font-bold">Project Tracker</h1>
          <button onClick={handleGoogleLogin} className="px-6 py-3 bg-white border border-slate-300 rounded-lg shadow-sm hover:bg-slate-50 transition">
            Sign in with Google
          </button>
        </div>
      );

      return (
        <div className="p-6 bg-slate-50 min-h-screen">
          <div className="max-w-[1200px] mx-auto bg-white rounded-lg border shadow-sm overflow-hidden">
            <table className="w-full text-left border-collapse">
              <thead className="bg-amber-400 text-amber-950 text-sm uppercase tracking-wider font-bold">
                <tr><th className="p-5">Project</th><th className="p-5">Category</th><th className="p-5">Status</th><th className="p-5">Next Steps</th><th className="p-5">Notes</th></tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {projects.map(p => {
                  const colors = CATEGORY_COLORS[p.category] || CATEGORY_COLORS[''];
                  return (
                    <tr key={p.id} className={`${colors.bg} ${colors.text}`}>
                      <td className="p-5 align-top"><input className={`w-full font-bold text-lg bg-transparent border-none ${colors.text}`} value={p.name} onChange={(e) => updateProjectField(p.id, 'name', e.target.value)} /></td>
                      <td className="p-5 align-top"><select value={p.category} onChange={(e) => updateProjectField(p.id, 'category', e.target.value)} className={`p-2 rounded text-base w-full bg-white/50 border ${colors.text}`}>{Object.keys(CATEGORY_COLORS).map(c => <option key={c} value={c}>{c || 'None'}</option>)}</select></td>
                      <td className="p-5 align-top"><AutoResizeTextarea value={p.status} onSave={(v) => updateProjectField(p.id, 'status', v)} className={`w-full text-base bg-transparent ${colors.text}`} /></td>
                      <td className="p-5 align-top">...list logic omitted for brevity...</td>
                      <td className="p-5 align-top">...list logic omitted for brevity...</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
